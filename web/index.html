<!DOCTYPE html>
<html lang="en" data-i18n-title="report.meta.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiDB Optimizer Issue Triage &amp; PR Status Hub</title>
<meta name="description" data-i18n-content="report.meta.description" content="Standalone triage & PR blocker workbench for open pingcap/tidb optimizer issues.">
<style>
  :root {
    color-scheme: light dark;
    accent-color: var(--accent);
    --header-h: 56px;
    --tidb-red: #dc150b;

    --bg: #f6f5f4;
    --bg-elevated: #ffffff;
    --surface: #f2f0ef;
    --surface-hover: #ebe8e6;
    --surface-subtle: #faf9f8;
    --border: #e0dcda;
    --border-strong: #cbc5c2;
    --text: #292526;
    --text-secondary: #494344;
    --muted: #686160;
    --accent: #98453b;
    --accent-hover: #79342c;
    --accent-bg: #f7eae6;
    --accent-border: #dfbfb7;
    --on-accent: #fff;
    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);

    --easy-bg: #ecfdf5; --easy-fg: #047857; --easy-bd: #a7f3d0;
    --med-bg: #fffbeb;  --med-fg: #b45309; --med-bd: #fde68a;
    --hard-bg: #fef2f2; --hard-fg: #be123c; --hard-bd: #fecdd3;
    --enh-bg: #eff6ff;  --enh-fg: #1d4ed8; --enh-bd: #bfdbfe;
    --flt-bg: #f1f5f9;  --flt-fg: #475569; --flt-bd: #cbd5e1;

    --sev-crit-bg: #fff1f2; --sev-crit-fg: #be123c; --sev-crit-bd: #fecdd3;
    --sev-maj-bg: #fff7ed;  --sev-maj-fg: #c2410c;  --sev-maj-bd: #fed7aa;
    --sev-mod-bg: #eff6ff;  --sev-mod-fg: #1d4ed8;  --sev-mod-bd: #bfdbfe;
    --sev-min-bg: #f8fafc;  --sev-min-fg: #475569;  --sev-min-bd: #cbd5e1;

    --pr-open-bg: #ecfdf5;   --pr-open-fg: #047857;   --pr-open-bd: #a7f3d0;
    --pr-merged-bg: #f5f3ff; --pr-merged-fg: #6d28d9; --pr-merged-bd: #ddd6fe;
    --pr-draft-bg: #f0f9ff;  --pr-draft-fg: #0369a1;  --pr-draft-bd: #bae6fd;
    --pr-closed-bg: #f1f5f9; --pr-closed-fg: #64748b; --pr-closed-bd: #cbd5e1;

    --qw-bg: #fffbeb;
    --qw-hover: #fef3c7;
    --flash-bg: color-mix(in srgb, var(--accent) 18%, transparent);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151416;
      --bg-elevated: #1e1d20;
      --surface: #282629;
      --surface-hover: #333033;
      --surface-subtle: #211f22;
      --border: #393538;
      --border-strong: #504a4d;
      --text: #f0ecea;
      --text-secondary: #d8d1cf;
      --muted: #b0a8a7;
      --accent: #efa194;
      --accent-hover: #ffc2b5;
      --accent-bg: #3e2a28;
      --accent-border: #704a43;
      --on-accent: #301b19;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.36);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);

      --easy-bg: #0a281e; --easy-fg: #34d399; --easy-bd: #115e46;
      --med-bg: #2b1f09;  --med-fg: #fbbf24;  --med-bd: #78480f;
      --hard-bg: #2f1119; --hard-fg: #fb7185; --hard-bd: #7f1d32;
      --enh-bg: #10233f;  --enh-fg: #60a5fa;  --enh-bd: #1e3a8a;
      --flt-bg: #18202f;  --flt-fg: #94a3b8;  --flt-bd: #2d3a4f;

      --sev-crit-bg: #350f1c; --sev-crit-fg: #fda4af; --sev-crit-bd: #881337;
      --sev-maj-bg: #321809;  --sev-maj-fg: #fdba74;  --sev-maj-bd: #7c2d12;
      --sev-mod-bg: #112240;  --sev-mod-fg: #93c5fd;  --sev-mod-bd: #1e3a8a;
      --sev-min-bg: #18202f;  --sev-min-fg: #94a3b8;  --sev-min-bd: #334155;

      --pr-open-bg: #0a291e;   --pr-open-fg: #4ade80;   --pr-open-bd: #165b3d;
      --pr-merged-bg: #23163b; --pr-merged-fg: #c4b5fd; --pr-merged-bd: #4c2882;
      --pr-draft-bg: #112437;  --pr-draft-fg: #7dd3fc;  --pr-draft-bd: #1e466e;
      --pr-closed-bg: #18202f; --pr-closed-fg: #8b9bb0; --pr-closed-bd: #2e3b4e;

      --qw-bg: #1e190d;
      --qw-hover: #292211;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151416;
    --bg-elevated: #1e1d20;
    --surface: #282629;
    --surface-hover: #333033;
    --surface-subtle: #211f22;
    --border: #393538;
    --border-strong: #504a4d;
    --text: #f0ecea;
    --text-secondary: #d8d1cf;
    --muted: #b0a8a7;
    --accent: #efa194;
    --accent-hover: #ffc2b5;
    --accent-bg: #3e2a28;
    --accent-border: #704a43;
    --on-accent: #301b19;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.36);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);

    --easy-bg: #0a281e; --easy-fg: #34d399; --easy-bd: #115e46;
    --med-bg: #2b1f09;  --med-fg: #fbbf24;  --med-bd: #78480f;
    --hard-bg: #2f1119; --hard-fg: #fb7185; --hard-bd: #7f1d32;
    --enh-bg: #10233f;  --enh-fg: #60a5fa;  --enh-bd: #1e3a8a;
    --flt-bg: #18202f;  --flt-fg: #94a3b8;  --flt-bd: #2d3a4f;

    --sev-crit-bg: #350f1c; --sev-crit-fg: #fda4af; --sev-crit-bd: #881337;
    --sev-maj-bg: #321809;  --sev-maj-fg: #fdba74;  --sev-maj-bd: #7c2d12;
    --sev-mod-bg: #112240;  --sev-mod-fg: #93c5fd;  --sev-mod-bd: #1e3a8a;
    --sev-min-bg: #18202f;  --sev-min-fg: #94a3b8;  --sev-min-bd: #334155;

    --pr-open-bg: #0a291e;   --pr-open-fg: #4ade80;   --pr-open-bd: #165b3d;
    --pr-merged-bg: #23163b; --pr-merged-fg: #c4b5fd; --pr-merged-bd: #4c2882;
    --pr-draft-bg: #112437;  --pr-draft-fg: #7dd3fc;  --pr-draft-bd: #1e466e;
    --pr-closed-bg: #18202f; --pr-closed-fg: #8b9bb0; --pr-closed-bd: #2e3b4e;

    --qw-bg: #1e190d;
    --qw-hover: #292211;
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  body.drawer-open { overflow: hidden; }

  a { color: var(--accent); text-decoration: none; transition: color 0.12s ease; }
  a:hover { color: var(--accent-hover); text-decoration: underline; }

  code, .inline-code {
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px; background: var(--surface);
    color: var(--text-secondary);
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border);
    overflow-wrap: anywhere;
  }

  button, select, input, textarea {
    font-family: inherit;
  }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .ico {
    display: inline-block; width: 14px; height: 14px;
    vertical-align: -2px; flex-shrink: 0;
  }
  .ico-lg { width: 16px; height: 16px; vertical-align: -3px; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
  .is-spinning .ico { animation: spin360 0.85s linear infinite; }

  /* Workspace navigation */
  .app-header {
    position: sticky; top: 0; z-index: 40;
    --nav-bg: #282528;
    --nav-hover: #3c383b;
    --nav-border: #595254;
    --nav-muted: #cec7c6;
    background: var(--nav-bg); color: #faf7f6; border-bottom: 1px solid var(--nav-border);
  }
  .header-inner, .wrap {
    width: min(100%, 1440px); margin-inline: auto; padding-inline: clamp(16px, 3.6vw, 58px);
  }
  .header-inner, .header-left, .header-right, .brand-wrap, .view-tabs, #rwBar {
    display: flex; align-items: center;
  }
  .header-inner { min-height: 60px; justify-content: space-between; gap: 16px; position: relative; }
  .header-left { gap: clamp(16px, 2.5vw, 38px); min-width: 0; }
  .brand-wrap { gap: 9px; }
  .brand-logo {
    width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center;
    border-radius: 8px; background: var(--tidb-red); color: white;
  }
  .brand-title { font-size: 14px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .view-tabs { gap: 3px; padding: 3px; background: #1b191b; border-radius: 8px; }
  .view-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--nav-muted); background: transparent; border: 0; border-radius: 5px;
    padding: 8px 11px; font-size: 13px; line-height: 1.3; font-weight: 600; white-space: nowrap; cursor: pointer;
  }
  .view-tab:hover { color: white; background: var(--nav-hover); }
  .view-tab.active { background: var(--accent-bg); color: var(--accent-hover); box-shadow: inset 0 -2px 0 var(--accent), inset 0 0 0 1px var(--accent-border); }
  .tab-cnt { font: 600 11px/1.4 ui-monospace, monospace; padding: 0 5px; border-radius: 4px; background: var(--nav-hover); color: #f3edeb; }
  .view-tab.active .tab-cnt { color: var(--accent-hover); background: var(--accent-border); }
  .header-right, #rwBar { gap: 6px; }
  #githubIdentity { max-width: 13ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hdr-divider { width: 1px; height: 17px; background: var(--nav-border); margin-inline: 2px; }
  .rw-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #a3e7ca; }
  .rw-badge.ro { color: var(--nav-muted); }
  .rw-badge::before, .dot { content: ""; display: inline-block; flex-shrink: 0; background: currentColor; width: 7px; height: 7px; border-radius: 50%; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--bg-elevated); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px;
    height: 30px; padding: 0 9px; font-size: 12px; font-weight: 500; line-height: 1;
    cursor: pointer; transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease; white-space: nowrap;
    box-shadow: var(--shadow-xs);
  }
  .btn:hover:not(:disabled) {
    background: var(--surface-hover); color: var(--text); border-color: var(--border-strong);
  }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .btn-icon { width: 30px; padding: 0; }
  .btn-primary {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent);
  }
  .btn-amber {
    background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); font-weight: 600;
  }
  .btn-amber:hover:not(:disabled) {
    background: var(--qw-hover); color: var(--med-fg); border-color: var(--med-fg);
  }
  .btn-danger-ghost {
    color: var(--hard-fg); border-color: var(--hard-bd); background: var(--hard-bg);
  }
  .btn-danger-ghost:hover:not(:disabled) {
    filter: brightness(0.96); color: var(--hard-fg);
  }
  .btn-badge {
    display: inline-flex; align-items: center; justify-content: center;
    height: 17px; min-width: 18px;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
    padding: 0 5px; border-radius: 999px; background: var(--surface); color: var(--text);
  }
  .btn-amber .btn-badge {
    background: rgba(180, 83, 9, 0.16); color: var(--med-fg);
  }

  .lang-switch {
    display: inline-flex; align-items: center; height: 30px; padding: 2px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface);
  }
  .lang-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; min-width: 28px;
    background: transparent; color: var(--muted); border: none;
    padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; line-height: 1; transition: background 0.12s ease, color 0.12s ease;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.active {
    background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-xs);
  }

  .app-header .btn, .app-header .lang-switch { background: transparent; color: #f3edeb; box-shadow: none; border-color: var(--nav-border); }
  .app-header .btn:hover:not(:disabled), .app-header .lang-btn:hover { background: var(--nav-hover); color: white; }
  .app-header .lang-btn { color: var(--nav-muted); }
  .app-header .lang-btn.active { background: var(--nav-border); color: white; }
  .app-header :focus-visible { outline-color: #f5afa1; }
  #headerMore { display: none; }

  /* Workspace heading and sync history */
  .wrap { padding-block: clamp(20px, 2.6vw, 38px) 64px; }
  .workspace-heading { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 20px; margin-bottom: 18px; }
  .workspace-title { min-width: 0; }
  .workspace-title h1 { margin: 0; font-size: clamp(24px, 2.3vw, 34px); line-height: 1.18; letter-spacing: -.04em; }
  #pageSub { margin: 5px 0 0; color: var(--muted); line-height: 1.5; }
  summary { cursor: pointer; }
  .sync-details { position: relative; }
  .sync-details > summary { width: fit-content; padding: 6px 11px; border-radius: 6px; color: var(--text-secondary); background: var(--bg-elevated); border: 1px solid var(--border-strong); font-size: 12px; font-weight: 600; }
  .sync-panel { position: absolute; right: 0; top: calc(100% + 7px); z-index: 25;
    width: min(25rem, calc(100vw - 36px)); padding: 16px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg-elevated); box-shadow: var(--shadow-lg); overflow-wrap: anywhere;
    max-height: 60dvh; overflow-y: auto;
  }
  .sync-times { display: grid; gap: 5px; margin: 0; color: var(--muted); font-size: 12px; }
  .sync-times > div { display: flex; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; }
  .sync-times dd { margin: 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .sync-details time { margin-inline-start: 3px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sync-tools { margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .copy-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 0 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1; cursor: pointer; transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
    max-width: 100%; height: auto; min-height: 22px; padding-block: 2px; text-align: left; overflow-wrap: anywhere;
  }
  .copy-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

  .delta-sec { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .delta-sec h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .delta-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow-y: auto; }
  .delta-list li {
    font-size: 12px; line-height: 1.45; padding: 5px 8px;
    background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px;
  }

  /* Issue queue shortcuts. Each bar shows the breakdown of its own metric. */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; min-width: 0;
  }
  .kpi {
    --kpi-accent: var(--accent);
    display: flex; flex-direction: column; align-items: stretch; min-width: 0;
    padding: 12px clamp(10px, 1.15vw, 17px); text-align: start; cursor: pointer;
    font: inherit; color: var(--text); border: 1px solid var(--border); border-radius: 9px;
    background-color: var(--bg-elevated);
    background-image: linear-gradient(130deg, color-mix(in srgb, var(--kpi-accent) 5%, transparent), transparent 72%);
    box-shadow: var(--shadow-xs);
  }
  .kpi[data-kpi-act="real"] { --kpi-accent: var(--easy-fg); }
  .kpi[data-kpi-act="high"] { --kpi-accent: var(--sev-maj-fg); }
  .kpi[data-kpi-act="pr_open"] { --kpi-accent: var(--pr-merged-fg); }
  .kpi:hover { border-color: var(--kpi-accent); }
  .kpi[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 5%, var(--bg-elevated));
    border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .kpi:focus-visible { outline-offset: 2px; }
  .kpi-label { color: var(--text-secondary); font-size: 12px; line-height: 1.35; font-weight: 650; }
  .kpi-reading { display: flex; align-items: baseline; gap: 5px; margin: 4px 0 9px; }
  .kpi-reading strong {
    font-size: clamp(28px, 2.3vw, 36px); line-height: 1.05; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -.045em; color: var(--kpi-accent);
  }
  .kpi-reading small { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .kpi[aria-pressed="true"] .kpi-reading::after {
    content: ""; align-self: center; margin-inline-start: auto; margin-inline-end: 2px;
    width: 9px; height: 5px; border: solid var(--accent); border-width: 0 0 2px 2px; transform: rotate(-45deg);
  }
  .kpi-track { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--surface); margin-top: auto; }
  .kpi-track > span { flex-basis: 0; background: var(--tone); }
  .kpi-legend {
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 8px;
    margin-top: 6px; min-height: 2.6em; color: var(--muted); font-size: 11px; line-height: 1.3; font-variant-numeric: tabular-nums;
  }
  .kpi-legend > span { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .kpi-legend > span::before {
    content: ""; align-self: center; width: 5px; height: 5px; border-radius: 50%; background: var(--tone);
  }
  .kpi-canonical, .kpi-open { --tone: var(--kpi-accent); }
  .kpi-supplemental { --tone: color-mix(in srgb, var(--kpi-accent) 48%, var(--surface)); }
  .kpi-easy { --tone: var(--easy-fg); }
  .kpi-medium, .kpi-major { --tone: var(--med-fg); }
  .kpi-hard, .kpi-critical { --tone: var(--hard-fg); }
  .kpi-uncovered { --tone: var(--flt-fg); }
  @media (min-width: 620px) and (max-width: 899px) {
    .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 619px) {
    .kpi-grid { gap: 7px; }
    .kpi { padding: 10px; }
  }

  /* PR queue shortcuts. */
  .court-cards {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px;
    background: var(--border); border: 1px solid var(--border); border-radius: 11px; overflow: hidden;
  }
  .court-card {
    position: relative; display: grid; align-content: start; justify-items: start; min-width: 0;
    padding: 13px clamp(12px, 1.6vw, 23px); border: 0; color: var(--text); text-align: left;
    background: var(--bg-elevated); cursor: pointer;
  }
  .court-card:hover { background: var(--surface-subtle); }
  .court-card.active { background: var(--accent-bg); box-shadow: inset 0 -3px 0 var(--accent); }
  .court-card:focus-visible { outline-offset: -3px; }
  .cc-title { font-size: 12px; font-weight: 650; line-height: 1.4; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .cc-val { font-size: clamp(22px, 2vw, 29px); font-weight: 700; letter-spacing: -.045em; font-variant-numeric: tabular-nums; line-height: 1.25; margin-block: 3px 2px; }

  .issue-overview {
    display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px;
  }
  .bug-trend { margin: 12px 0; }

  #trendReset { white-space: nowrap; }

  @container (max-width: 660px) {
    .bug-trend .matrix-head { grid-template-columns: 1fr; gap: 4px; }
    #bugTrendLatest { text-align: start; }
    .trend-readout { grid-template-columns: minmax(0, 1fr) auto; }
  }
  .matrix-box {
    display: flex; flex-direction: column;
    min-width: 0; padding: 12px 16px 10px; background: var(--bg-elevated);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-xs);
    container-type: inline-size;
  }
  .matrix-head, .matrix-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .matrix-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .matrix-hint { color: var(--muted); font-size: 11px; }
  .matrix-head h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; line-height: 1.4; }
  .rubric-link {
    display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 2px 5px;
    border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px;
  }
  .rubric-link:hover, .rubric-link:focus-visible { color: var(--accent); background: var(--surface); }
  .rubric-link .ico { width: 15px; height: 15px; }
  table.mtx { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; margin: 2px 0 5px; }
  .mtx th { text-align: center; color: var(--muted); font-size: 11px; font-weight: 550; line-height: 1.4; padding: 3px 0; }
  .mtx thead th:first-child, .mtx th[scope=row] { width: 16%; text-align: start; }
  .mtx th[scope=row] { color: var(--text-secondary); }
  .mtx th[scope=row] span { display: inline-flex; align-items: center; gap: 5px; }
  .mtx .dot { width: 6px; height: 6px; }
  .mtx td { padding: 0; }
  .mtx button {
    position: relative; display: block; width: 100%; min-height: 30px; padding: 3px 1px;
    border: 1px solid transparent; border-radius: 4px; background: var(--surface);
    background: color-mix(in srgb, var(--accent) var(--heat, 0%), var(--surface));
    color: var(--text); font: inherit; font-size: 14px; font-weight: 650; line-height: 1.2;
    font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .mtx .total-cell button { background: transparent; color: var(--text-secondary); }
  .mtx .zero-cell button { color: var(--muted); font-weight: 400; }
  .mtx .quick-win button::after, .quick-win-key::before {
    content: ""; display: inline-block; width: 5px; height: 5px; background: var(--med-fg); transform: rotate(45deg);
  }
  .mtx .quick-win button::after { position: absolute; inset: 4px 5px auto auto; }
  .quick-win-key { display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); }
  .matrix-foot .matrix-breakdown { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 8px; }
  .mtx button:hover { border-color: var(--muted); }
  .mtx button[aria-pressed=true] {
    background: var(--accent-bg); color: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .mtx button:focus-visible { outline-offset: 0; }
  .mtx tbody tr:last-child > * { border-top: 1px solid var(--border); padding-top: 3px; }
  .matrix-foot { margin-top: auto; flex-wrap: wrap; padding: 7px 3px 0; border-top: 1px solid var(--border); font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .matrix-foot strong { color: var(--text-secondary); font-weight: 600; }
  .matrix-foot span { font-variant-numeric: tabular-nums; }
  .matrix-sev-code { display: none; }
  @container (max-width: 440px) {
    .matrix-sev-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .matrix-sev-code { display: inline; }
    .mtx thead th:first-child, .mtx th[scope=row] { width: 19%; }
  }
  @media (max-width: 899px) {
    .issue-overview { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  }
  @media (max-width: 619px) {

  }

  /* Reference the rubric without moving the matrix or its results. */
  #rubricDrawer { background: rgba(13, 23, 32, .32); backdrop-filter: none; -webkit-backdrop-filter: none; }
  #rubricDrawer .drawer-panel { width: min(460px, 100%); }
  #rubricDrawer .drawer-hdr { padding: 16px 20px; }
  .rubric-nav {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;

  }

  .rubric-nav input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .rubric-nav span { display: grid; place-items: center; min-height: 32px; border-radius: 4px; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; }
  .rubric-nav input:checked + span { background: var(--accent-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-border); }
  .rubric-nav input:focus-visible + span { outline: 2px solid var(--accent); }
  .rubric-topic { display: none; min-height: 0; overflow-y: auto; padding: 5px 20px 16px; }
  #rubricDrawer:has(#guideDifficulty:checked) #rulesDifficulty,
  #rubricDrawer:has(#guideSeverity:checked) #rulesSeverity,
  #rubricDrawer:has(#guideScope:checked) #rulesScope { display: block; }
  .rubric-topic ul { list-style: none; margin: 0 0 16px; padding: 0; }
  .rubric-topic li { margin-block: 8px; padding: 8px 12px; border-inline-start: 3px solid var(--rule-color, var(--border-strong)); color: var(--text-secondary); font-size: 13px; line-height: 1.65; }
  .rubric-topic li b:first-child { display: block; color: var(--rule-color, var(--text)); }
  .rubric-topic li code { font-size: .92em; }
  @media (max-width: 619px) {
    #rubricDrawer { align-items: flex-end; }
    #rubricDrawer .drawer-panel { width: 100%; height: 82%; height: min(82dvh, 610px); border-radius: 14px 14px 0 0; border: 1px solid var(--border); }
  }

  /* Query and result list */
  .list-panel {
    margin-top: 14px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg-elevated);
  }
  .controls { padding: 15px clamp(12px, 1.5vw, 21px) 0; }
  .query-line {
    display: grid; align-items: end; gap: 10px;
    grid-template-columns: minmax(14em, 1.8fr) repeat(2, minmax(0, 1fr)) auto;
  }
  .query-select { min-width: 0; display: grid; align-content: end; gap: 3px; }
  .query-select > span, .date-grp { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .query-select select, .filter-grid input[type=date] { width: 100%; height: 35px; background: var(--bg-elevated); }
  .filter-toggle { height: 35px; }
  .filter-toggle[aria-expanded=true] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 8px 12px; align-items: end; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--border); }
  .search-wrap { position: relative; display: flex; align-items: center; min-width: 0; }

  .search-wrap .search-ico {
    position: absolute; left: 9px; color: var(--muted); pointer-events: none; display: inline-flex;
  }
  .search-wrap input[type="search"] {
    width: 100%; height: 35px; padding: 0 36px 0 30px;
    background: var(--surface-subtle); color: var(--text);

    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .search-wrap input[type="search"]:focus {
    background: var(--bg-elevated); border-color: var(--accent);
  }
  .search-wrap input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .kbd-hint {
    position: absolute; right: 8px; padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: var(--muted); background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; pointer-events: none; line-height: 1.3;
  }
  .search-clear {
    position: absolute; right: 6px; background: var(--surface); color: var(--muted);
    border: none; border-radius: 4px; width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .search-clear:hover { color: var(--text); background: var(--surface-hover); }

  select, input[type="date"], input[type="text"], input[type="password"], textarea {
    background: var(--surface-subtle); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px; font-size: 12px; line-height: 18px; min-width: 0; max-width: 100%;

  }

  .filter-flags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .filter-flags label { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; cursor: pointer; }
  .filter-flags input { margin: 0; }
  .date-grp { display: grid; gap: 3px; min-width: 0; }

  .status-line {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 7px; padding: 11px clamp(12px, 1.5vw, 21px);
    color: var(--muted); font-size: 12px;

  .active-filters {

  }
  .count-strong { font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  /* Record lists */
  .tbl-card { min-width: 0; }
  .record-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-bottom: 3px; }

  col.c-cat { width: 16%; }

  /* Row Cells & Badges */

  .user-link {
    color: var(--muted); font-weight: 500; line-height: 18px;
    display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
  .user-link:hover { color: var(--accent); }
  .assignee-pill {
    display: inline-flex; align-items: center; gap: 3px; margin-top: 2px;
    min-height: 18px; max-width: 100%; padding: 2px 5px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 1.25;
    background: var(--enh-bg); color: var(--enh-fg); overflow-wrap: anywhere;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty-state h3 { margin: 8px 0 4px; font-size: 14px; color: var(--text); }
  .empty-state p { margin: 0 0 12px; font-size: 12.5px; }

  /* ==================== SLIDE-OVER DRAWERS & TOAST ==================== */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: 90; display: flex; justify-content: flex-end;
  }
  @keyframes slideInRight {
    from { transform: translateX(24px); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  .drawer-panel {
    width: 540px; max-width: 100vw; height: 100%;
    background: var(--bg-elevated); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-lg); animation: slideInRight 0.16s ease-out;
  }
  .drawer-hdr {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
  }
  .drawer-hdr h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .drawer-body {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .drawer-meta-card {
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .dm-title { font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text); }
  .dm-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px;
    font-size: 12px; color: var(--muted);
  }
  .dm-grid b { color: var(--text-secondary); font-weight: 600; }
  dialog.drawer-backdrop {
    margin: 0; padding: 0; border: 0; width: 100%; height: 100%;
    max-width: none; max-height: none; color: var(--text);
  }
  dialog.drawer-backdrop::backdrop { background: transparent; }
  .inspect-facts {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px;
    padding: 14px 0; margin: 0; border-block: 1px solid var(--border);
  }
  .inspect-facts dt, .inspect-note h4 { font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 500; }
  .inspect-facts dd { margin: 0; font-weight: 600; }
  #editIssueHeading { font-size: 19px; line-height: 1.4; margin: 0; }
  .inspect-summary h3 { font-size: 14px; margin: 20px 0 10px; }
  .inspect-note p { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0; }
  .inspect-note + .inspect-note { margin-top: 14px; }
  .drawer-panel { overflow-wrap: anywhere; }
  #inboxTabsBar { overflow-x: auto; }
  .drawer-sec-title {
    font-size: 11.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: -6px;
  }
  .fld-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .fld select, .fld textarea, .fld input[type="text"], .fld input[type="password"] { width: 100%; }
  .fld textarea { min-height: 72px; resize: vertical; line-height: 1.48; }
  .chk-card {
    display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px;
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 12.5px;
  }
  .chk-card input { margin-top: 3px; }
  .chk-card small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .drawer-ftr {
    padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-subtle);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .pend-card .ctrl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pend-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    background: var(--surface-subtle); display: flex; flex-direction: column; gap: 9px;
  }
  .pend-pre {
    max-height: 190px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px;
    padding: 9px; font-size: 12px; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sug-banner {
    background: var(--bg-elevated); border: 1px dashed var(--enh-bd); border-radius: 6px;
    padding: 7px 10px; font-size: 11.5px; color: var(--text-secondary);
    display: flex; flex-direction: column; gap: 4px;
  }
  .retriage-banner {
    background: var(--med-bg); border: 1px solid var(--med-bd); border-radius: 8px;
    padding: 11px 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .retriage-banner-hdr {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; font-weight: 700; color: var(--med-fg);
  }
  .retriage-list {
    margin: 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary);
    display: flex; flex-direction: column; gap: 4px;
  }
  .exclude-zone {
    margin-top: 4px; border: 1px dashed var(--hard-bd); border-radius: 8px;
    padding: 9px 12px; background: var(--surface-subtle);
  }
  .exclude-zone summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--hard-fg);
    user-select: none;
  }
  .exclude-canonical-note {
    margin-top: 4px; padding: 8px 11px; border-radius: 6px;
    border: 1px dashed var(--border); background: var(--surface-subtle);
    font-size: 11.5px; color: var(--muted);
  }
  .inbox-tabs {
    display: flex; align-items: center; gap: 4px; padding: 8px 18px;
    border-bottom: 1px solid var(--border); background: var(--bg-elevated);
  }
  .inbox-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 12px; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    font-variant-numeric: tabular-nums; transition: all 0.12s ease;
  }
  .inbox-tab:hover { color: var(--text); background: var(--surface); }
  .inbox-tab.active {
    background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border);
  }
  .inbox-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .toast-box {
    position: fixed; bottom: 20px; right: 20px; z-index: 130;
    display: flex; align-items: center; gap: 8px;
    background: var(--text); color: var(--bg-elevated);
    padding: 10px 15px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    box-shadow: var(--shadow-lg); max-width: calc(100vw - 36px);
  }
  .toast-box.toast-err { background: #be123c; color: #ffffff; }

  .back-top-btn {
    position: fixed; bottom: 22px; left: 22px; z-index: 50;
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--bg-elevated); color: var(--text-secondary);
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.14s ease;
  }
  .back-top-btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); transform: translateY(-2px); }

  @media (max-width: 1199px) {
    #headerMore { display: inline-flex; }
    .header-right {
      display: none; position: absolute; top: calc(100% - 4px); right: clamp(12px, 3.6vw, 52px);
      max-height: calc(100dvh - var(--header-h)); max-width: calc(100% - 24px); overflow: auto;
      padding: 12px; border: 1px solid var(--nav-border); border-radius: 8px; background: var(--nav-bg);
      box-shadow: var(--shadow-lg); grid-template-columns: 1fr auto;
    }
    #headerMore[aria-expanded=true] + .header-right { display: grid; }
    .header-right > :not(.lang-switch, #themeBtn), #rwBar > .btn { grid-column: 1 / -1; }
    #rwBar { display: contents; }
    #rwBar .hdr-divider { display: none; }
    #githubIdentity { max-width: 24ch; }
    .lang-switch { justify-content: center; }
  }
  @media (max-width: 840px) {
    .query-line { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
    .query-line .search-wrap { grid-column: 1 / -1; }
    .tbl-card :is(table, tbody, td) { display: block; width: 100%; }
    .tbl-card :is(colgroup, thead) { display: none; }
    .tbl-card tr {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start;
      gap: 8px 12px; border-top: 1px solid var(--border); padding: 14px clamp(12px, 2vw, 21px);
    }
    .tbl-card table td { min-width: 0; border: 0; padding: 0; }
    .tbl-card td:first-child { grid-column: 1 / -1; }
    .tbl-card tbody tr:hover td { background: transparent; }
    .fld-grid-2, .dm-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .header-inner, .wrap { padding-inline: 12px; }
    .header-inner { gap: 8px; min-height: 52px; }
    .brand-title, .hide-xs { display: none; }
    .header-left { gap: 9px; }
    .workspace-heading { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; margin-bottom: 14px; }
    .workspace-title { display: contents; }
    .workspace-title h1 { grid-column: 1; grid-row: 1; }
    #pageSub { grid-column: 1 / -1; grid-row: 2; margin: 0; font-size: 12px; }
    .sync-details { grid-column: 2; grid-row: 1; }
    .court-card .cc-sub { display: none; }
    .sync-details { position: static; }
    .sync-panel { inset-inline: 0; width: auto; }
    .court-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .court-card { padding: 9px 12px; }
    .cc-val { margin-block: 2px; }
    .query-line { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    .query-line .search-wrap { grid-column: span 3; }
    .query-line .filter-toggle { grid-column: 4; grid-row: 1; padding-inline: 4px; white-space: normal; line-height: 1.2; }
    .query-line .query-select { grid-column: span 2; }
    .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tbl-card tr { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tbl-card td:last-child { grid-column: 1 / -1; }
    .tbl-card .meta-cell { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
    .tbl-card .meta-cell br { display: none; }
  }
  @media (max-width: 410px) {
    .view-tab { padding-inline: 7px; }
    .view-tab .ico { display: none; }
    .brand-logo { width: 25px; height: 25px; }
  }
  @media (max-width: 359px) {
    .tab-cnt, .sync-details time { display: none; }
    .header-left { gap: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

</style>
</head>
<body>
<header class="app-header" id="appHeader">
  <div class="header-inner">
    <div class="header-left">
      <div class="brand-wrap">
        <span class="brand-logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </span>
        <span class="brand-title" data-i18n="common.appBrand">TiDB Optimizer Triage Hub</span>
      </div>

      <div class="view-tabs" role="tablist" data-i18n-aria-label="report.header.boards">
        <button type="button" class="view-tab active" id="tabIssuesBtn" aria-controls="viewIssuesSection" role="tab" aria-selected="true" data-view="issues">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          <span data-i18n="report.views.issuesTab">Issue Triage</span>
          <span class="tab-cnt" id="tabIssuesCnt">0</span>
        </button>
        <button type="button" class="view-tab" id="tabPrsBtn" aria-controls="viewPrsSection" role="tab" aria-selected="false" data-view="prs">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" y1="9" x2="6" y2="21"></line></svg>
          <span data-i18n="report.views.prsTab">PR Status</span>
          <span class="tab-cnt" id="tabPrsCnt">0</span>
        </button>
      </div>
    </div>

    <button type="button" id="headerMore" class="btn" aria-expanded="false" aria-controls="headerActions" data-i18n="report.nav.more">More</button>
    <div class="header-right" id="headerActions">
      <span class="rw-badge" id="permBadge"></span>
      <div id="rwBar" hidden>
        <button type="button" class="btn btn-amber" id="pendingInboxBtn" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
          <span data-i18n="report.rw.pendingBtn">Inbox</span>
          <span class="btn-badge" id="pendingCntBadge">0</span>
        </button>
        <button type="button" class="btn" id="authLogoutBtn" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span data-i18n="report.rw.lockBtn">Lock</span>
        </button>
        <span class="hdr-divider"></span>
      </div>

      <a class="btn" id="githubSignInBtn" href="./auth/github" hidden>Sign in with GitHub</a>
      <span id="githubIdentity" hidden></span>
      <button type="button" class="btn" id="authUnlockBtn" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        <span data-i18n="report.rw.unlockBtn">Unlock RW</span>
      </button>

      <div class="lang-switch" role="group" data-i18n-aria-label="common.langSwitchAria" aria-label="Language">
        <button type="button" class="lang-btn" data-lang-opt="zh-CN">中</button>
        <button type="button" class="lang-btn" data-lang-opt="en">EN</button>
      </div>
      <button class="btn btn-icon" id="themeBtn" type="button" data-i18n-aria-label="common.toggleThemeAria" aria-label="Theme"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="workspace-heading">
    <div class="workspace-title">
      <h1 id="workspaceTitle"></h1>
      <p id="pageSub"></p>
    </div>
    <details class="sync-details" id="syncDetails">
      <summary><span data-i18n="report.nav.syncInfoBtn"></span> <time id="snapshotTime"></time></summary>
      <div class="sync-panel">
        <dl class="sync-times">
          <div><dt data-i18n="report.sync.snapshotLabel"></dt><dd id="syncSnapTxt"></dd></div>
          <div id="prSyncWrap" hidden><dt data-i18n="report.sync.prSnapshotLabel"></dt><dd id="prSyncSnapTxt"></dd></div>
          <div><dt data-i18n="report.sync.watermarkLabel"></dt><dd id="syncWatermarkCode"></dd></div>
        </dl>
        <div class="sync-tools">
          <button type="button" class="copy-chip" id="copySyncBtn" data-i18n-title="report.sync.copyTitle"></button>
          <button type="button" class="btn" id="syncPrsBtn" hidden>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            <span id="syncPrsBtnLbl" data-i18n="report.rw.syncPrsBtn">Sync PRs</span>
          </button>
          <button type="button" class="btn" id="syncIssuesBtn" hidden>
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
            <span id="syncIssuesBtnLbl" data-i18n="report.rw.syncIssuesBtn">Sync Issues</span>
          </button>
        </div>
        <div id="deltaPopoverBody"></div>
      </div>
    </details>
  </div>

  <section id="viewIssuesSection" role="tabpanel" aria-labelledby="tabIssuesBtn">
    <div class="issue-overview">
      <div class="kpi-grid" id="kpis"></div>
      <section class="matrix-box" aria-labelledby="matrixTitle">
        <div class="matrix-head">
          <div class="matrix-heading">
            <h2 id="matrixTitle" data-i18n="report.matrix.title"></h2>
            <span class="matrix-hint" id="matrixHint" data-i18n="report.matrix.hint"></span>
          </div>
          <button type="button" class="rubric-link" id="toggleRubricBtn" aria-haspopup="dialog" aria-controls="rubricDrawer">
            <svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-3-2-6-2.5-10-2v15c4-.6 7-.1 10 2 3-2.1 6-2.6 10-2V4c-4-.5-7 0-10 2Zm0 0v15"></path></svg>
            <span data-i18n="report.rubric.link"></span>
          </button>
        </div>
        <table class="mtx" aria-labelledby="matrixTitle" aria-describedby="matrixHint">
          <thead><tr>
            <th scope="col" data-i18n="report.matrix.corner"></th>
            <th scope="col"><span class="matrix-sev-code" aria-hidden="true">S0</span><span class="matrix-sev-name" data-i18n="report.enums.severityShort.CRITICAL"></span></th>
            <th scope="col"><span class="matrix-sev-code" aria-hidden="true">S1</span><span class="matrix-sev-name" data-i18n="report.enums.severityShort.MAJOR"></span></th>
            <th scope="col"><span class="matrix-sev-code" aria-hidden="true">S2</span><span class="matrix-sev-name" data-i18n="report.enums.severityShort.MODERATE"></span></th>
            <th scope="col"><span class="matrix-sev-code" aria-hidden="true">S3</span><span class="matrix-sev-name" data-i18n="report.enums.severityShort.MINOR"></span></th>
            <th scope="col" data-i18n="report.matrix.total"></th>
          </tr></thead>
          <tbody id="mtxBody"></tbody>
        </table>
        <div class="matrix-foot">
          <div class="matrix-breakdown"><strong id="matrixContext"></strong><span id="matrixCounts"></span></div>
          <span class="quick-win-key" data-i18n="report.matrix.quickWinTag"></span>
        </div>
      </section>
    </div>

    <figure class="matrix-box bug-trend" id="bugTrend" hidden>
      <figcaption class="matrix-head">
        <div class="matrix-heading">
          <h2 id="bugTrendTitle" data-i18n="report.bugTrend.title"></h2>
          <span class="matrix-hint" data-i18n="report.bugTrend.hint"></span>
        </div>
        <div class="trend-readout">
          <strong id="bugTrendLatest"></strong>
          <button id="trendReset" type="button" class="btn" data-i18n="report.bugTrend.all" disabled></button>
        </div>
      </figcaption>
      <div class="trend-chart"><canvas id="bugTrendPlot" role="img" aria-labelledby="bugTrendTitle bugTrendLatest"></canvas></div>
    </figure>

    <div class="list-panel">
      <div class="controls">
        <div class="query-line">
          <div class="search-wrap">
            <span class="search-ico" aria-hidden="true">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="search" id="q" data-i18n-placeholder="report.filters.searchPlaceholder" data-i18n-aria-label="report.filters.searchAria">
            <kbd class="kbd-hint" id="qKbdHint">/</kbd>
            <button type="button" class="search-clear" id="qClearBtn" data-i18n-title="report.filters.clearSearch" hidden>
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <label class="query-select">

  <div class="drawer-panel" style="width:100%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--border);">
    <div class="drawer-hdr">
      <h2 id="authModalTitle" data-i18n="report.rw.authModalTitle"></h2>
      <button type="button" class="btn btn-icon" id="closeAuthModalBtn" data-i18n-title="report.rw.drawer.close" data-i18n-aria-label="report.rw.drawer.close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="drawer-body" style="gap:12px;">
      <p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;" data-i18n="report.rw.authModalHint"></p>
      <div class="fld">
        <input type="password" id="authTokenInput" data-initial-focus data-i18n-aria-label="report.rw.authTokenPlaceholder" autocomplete="current-password" data-i18n-placeholder="report.rw.authTokenPlaceholder">
      </div>
      <div id="authErrorMsg" role="alert" style="font-size:12px;color:var(--sev-crit-fg);" hidden></div>
    </div>
    <div class="drawer-ftr" style="justify-content:flex-end;gap:8px;">
      <button type="button" class="btn" id="authCancelBtn" data-i18n="report.rw.authCancelBtn"></button>
      <button type="button" class="btn btn-primary" id="authSubmitBtn" data-i18n="report.rw.authSubmitBtn"></button>
    </div>
  </div>
</dialog>

<div class="toast-box" id="toastBox" role="status" aria-live="polite" hidden></div>
<button type="button" class="back-top-btn" id="backTopBtn" data-i18n-title="common.backToTop" hidden>
  <svg class="ico ico-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
</button>

<script src="/assets/vendor/charts.min.js"></script>
<!--SERVER_INLINE_BUNDLE-->
<script>
(function() {
  "use strict";

  function appUrl(subpath) {
    var p = (window.location && window.location.pathname) || "/";
    if (p.slice(-11) === "/index.html") p = p.slice(0, -10);
    if (p.charAt(p.length - 1) !== "/") p += "/";
    return p + String(subpath || "").replace(/^\.?\//, "");
  }

  var moreButton = document.getElementById("headerMore");
  var headerActions = document.getElementById("headerActions");
  function closeHeaderActions() {
    moreButton.setAttribute("aria-expanded", "false");
  }
  moreButton.addEventListener("click", function() {
    moreButton.setAttribute("aria-expanded", moreButton.getAttribute("aria-expanded") !== "true");
  });
  document.addEventListener("click", function(event) {
    if (!event.target.closest("#headerMore, #headerActions")) closeHeaderActions();
  });
  headerActions.addEventListener("click", function(event) {
    if (moreButton.getAttribute("aria-expanded") === "true" && event.target.closest("button, a")) {
      if (headerActions.contains(document.activeElement)) moreButton.focus();
      closeHeaderActions();
    }
  });
  document.addEventListener("focusin", function(event) {
    if (!event.target.closest("#headerMore, #headerActions")) closeHeaderActions();
  });
  window.matchMedia("(max-width: 1199px)").addEventListener("change", closeHeaderActions);

  var SESSION = window.TRIAGE_SESSION || {
    viewer: { login: "anonymous", role: "viewer" },
    permissions: { can_triage: false, can_sync: false }
  };
  var CAN_TRIAGE = Boolean(SESSION.permissions && SESSION.permissions.can_triage);
  var CAN_SYNC = Boolean(SESSION.permissions && SESSION.permissions.can_sync);
  var AUTH_REQUIRED = Boolean(SESSION.auth_required);
  var IS_AUTHENTICATED = Boolean(SESSION.authenticated);
  var DATA_HAS_WORKBENCH = Boolean(SESSION.permissions && SESSION.permissions.can_triage);

  var esc = SiteI18n.escHtml;
  var t = SiteI18n.t;

  function safeHref(rawUrl) {
    var s = String(rawUrl || "").trim();
    if (/^https?:\/\//i.test(s)) return esc(s);
    return "#";
  }

  var ICONS = {
    sun: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
    moon: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
    copy: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
    check: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
    edit: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>',
    eye: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
    locate: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>',
    ext: '<svg class="ico" style="width:11px;height:11px;vertical-align:-1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>',
    pr: '<svg class="ico" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" y1="9" x2="6" y2="21"></line></svg>',
    merge: '<svg class="ico" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M6 21V9a9 9 0 0 0 9 9"></path></svg>',
    alert: '<svg class="ico" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
    clock: '<svg class="ico" style="width:11px;height:11px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
    close: '<svg class="ico" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
    reset: '<svg class="ico" style="width:12px;height:12px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>'
  };

  function fmtInlineCode(raw) {
    if (!raw) return "";
    return esc(raw).replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
  }

  function fmtUsers(arr) {
    if (!arr || !arr.length) return "";
    return arr.filter(Boolean).map(function(u) { return "@" + u; }).join(", ");
  }

  var META = window.REPORT_DATASET.sync_meta;
  var DATA = window.REPORT_DATASET.records || [];
  var PR_STATUS = window.REPORT_DATASET.pr_status || {};
  var PENDING = window.TRIAGE_PENDING || [];
  var SNAPSHOT_MS = Date.parse(META.snapshot_utc);

  var BADGE_CLS = {
    EASY: "badge-easy",
    MEDIUM: "badge-medium",
    HARD: "badge-hard",
    ENHANCEMENT: "badge-enh",
    FILTER_RANDOM_FUZZ: "badge-fuzz",
    FILTER_AI_OBSCURE: "badge-ai",
    FILTER_NON_OPT_OR_FIXED: "badge-other"
  };

  var SEV_CLS = {
    CRITICAL: "sev-critical",
    MAJOR: "sev-major",
    MODERATE: "sev-moderate",
    MINOR: "sev-minor",
    "N/A": "sev-na"
  };

  var STAGE_CHIP_CLS = {
    DRAFT_OR_HOLD: "pr-draft",
    CONFLICT: "pr-danger",
    NEEDS_OK_TO_TEST: "pr-rev",
    CI_FAILED: "pr-danger",
    WAITING_AUTHOR: "pr-warn",
    GATE_BLOCKED: "pr-warn",
    NEEDS_LGTM2: "pr-lgtm1",
    WAITING_REVIEWER: "pr-rev",
    READY_MERGING: "pr-open"
  };

  var activeView = "issues";
  var editingIssueNum = null;
  // Inspect has no draft. A writable draft owns its reviewed binding and defaults.
  var editingDraft = null;
  var frozenEditDraft = null;
  var capturePendingCardDrafts = function() {};
  var editDrawerGen = 0;
  var sessionEpoch = 0;
  var workbenchRevision = Number.isSafeInteger(window.TRIAGE_SNAPSHOT_REVISION) ? window.TRIAGE_SNAPSHOT_REVISION : 0;
  var toastTimer = null;
  var renderInboxDrawer = function() {};

  var SCOPE_COUNTS = { all: 0, can: 0, cust: 0, bdr: 0, sup: 0, excluded: 0 };
  var PR_ITEMS = [];
  var PR_BOARD_KEYS = {};
  var RETRIAGE_LIST = [];
  var activeInboxTab = "pending";
  var EXCLUDED_ITEMS = Array.isArray(window.TRIAGE_EXCLUDED) ? window.TRIAGE_EXCLUDED : null;
  var excludedLoading = false;
  var excludedLoadError = "";
  var excludedQuery = "";
  var pendingDrafts = {};

  function formatRetriageReason(code) {
    var key = "report.rw.retriageReasons." + code;
    var val = t(key);
    return (!val || val === key) ? code : val;
  }

  function hasCanonicalLabels(labels) {
    var hasPlanner = false, hasBug = false;
    (labels || []).forEach(function(l) {
      var low = String(l || "").toLowerCase();
      if (low === "sig/planner") hasPlanner = true;
      if (low === "type/bug") hasBug = true;
    });
    return hasPlanner && hasBug;
  }

  function showToast(msg, kind) {
    var box = document.getElementById("toastBox");
    box.classList.toggle("toast-err", kind === "error");
    box.innerHTML = (kind === "error" ? ICONS.alert : ICONS.check) + '<span>' + esc(msg) + '</span>';
    box.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      box.hidden = true;
    }, kind === "error" ? 4800 : 3000);
  }

  function updateThemeBtnUI() {
    var btn = document.getElementById("themeBtn");
    if (!btn) return;
    var isDark = SiteI18n.getEffectiveTheme() === "dark";
    btn.innerHTML = isDark ? ICONS.sun : ICONS.moon;
    var ttl = isDark ? t("common.themeToLight") : t("common.themeToDark");
    btn.setAttribute("title", ttl);
    btn.setAttribute("aria-label", ttl);
  }

  function rebuildDerivedIndexes() {
    META = window.REPORT_DATASET.sync_meta;
    DATA = window.REPORT_DATASET.records || [];
    PR_STATUS = window.REPORT_DATASET.pr_status || {};
    SNAPSHOT_MS = Date.parse(META.snapshot_utc);

    SCOPE_COUNTS.all = DATA.length;
    SCOPE_COUNTS.can = DATA.filter(function(r) { return r.is_canonical; }).length;
    SCOPE_COUNTS.cust = DATA.filter(function(r) { return r.is_customer; }).length;
    SCOPE_COUNTS.bdr = DATA.filter(function(r) { return r.is_borderline_kept; }).length;
    SCOPE_COUNTS.sup = SCOPE_COUNTS.all - SCOPE_COUNTS.can;
    RETRIAGE_LIST = DATA.filter(function(r) { return Boolean(r.needs_retriage); });
    SCOPE_COUNTS.excluded = Array.isArray(EXCLUDED_ITEMS)
      ? EXCLUDED_ITEMS.length
      : ((META.excluded_issue_nums || []).length);

    var linkedIssuesMap = {};
    var fallbackRefMap = {};
    for (var i = 0; i < DATA.length; i++) {
      var iss = DATA[i];
      for (var j = 0; j < iss.prs.length; j++) {
        var p = iss.prs[j];
        if (p.state !== "OPEN" && p.state !== "DRAFT") continue;
        var key = p.repo + "#" + p.num;
        if (!linkedIssuesMap[key]) linkedIssuesMap[key] = [];
        linkedIssuesMap[key].push(iss);
        if (!fallbackRefMap[key]) fallbackRefMap[key] = p;
      }
    }

    function isOnlyLinkedToFilteredFixedOrNonOpt(key, st) {
      var linked = linkedIssuesMap[key] || [];
      if (!linked.length) return false;
      var allFiltered = linked.every(function(iss) {
        return iss.cat === "FILTER_NON_OPT_OR_FIXED";
      });
      if (!allFiltered) return false;
      if (st && Array.isArray(st.track_sources)) {
        var hasDirectTrack = st.track_sources.some(function(src) {
          return src && src !== "issue_linked";
        });
        if (hasDirectTrack) return false;
      }
      return true;
    }

    var allKeys = {};
    Object.keys(fallbackRefMap).forEach(function(k) {
      if (!isOnlyLinkedToFilteredFixedOrNonOpt(k, PR_STATUS[k])) allKeys[k] = true;
    });
    Object.keys(PR_STATUS).forEach(function(k) {
      var st = PR_STATUS[k];
      if (st && (st.state === "OPEN" || st.state === "DRAFT") && !isOnlyLinkedToFilteredFixedOrNonOpt(k, st)) {
        allKeys[k] = true;
      }
    });
    PR_BOARD_KEYS = allKeys;

    PR_ITEMS = Object.keys(allKeys).map(function(key) {
      var st = PR_STATUS[key];
      var fb = fallbackRefMap[key];
      var issues = (linkedIssuesMap[key] || []).slice().sort(function(a, b) {
        if (b.sev_rank !== a.sev_rank) return b.sev_rank - a.sev_rank;
        var da = a.diff_rank || 99, db = b.diff_rank || 99;
        if (da !== db) return da - db;
        return b.number - a.number;
      });
      var maxSevRank = 0;
      var bestDiffRank = 99;
      var hasRealBug = false;
      var subSet = {};
      issues.forEach(function(iss) {
        if (iss.sev_rank > maxSevRank) maxSevRank = iss.sev_rank;
        if (iss.diff_rank > 0 && iss.diff_rank < bestDiffRank) bestDiffRank = iss.diff_rank;
        if (iss.cat === "EASY" || iss.cat === "MEDIUM" || iss.cat === "HARD") hasRealBug = true;
        if (iss.subsystem) subSet[iss.subsystem] = true;
      });

      if (!st && fb) {
        st = {
          repo: fb.repo, num: fb.num, label: fb.label, url: fb.url, title: fb.title,
          author: "", state: fb.state, is_draft: fb.state === "DRAFT",
          is_cherry_pick: Boolean(fb.is_cherry_pick),
          updated_at: fb.updated_at || "",
          updated_display: (fb.updated_at || "").slice(0, 16).replace("T", " "),
          waiting_days: 0,
          blocker_stage: fb.state === "DRAFT" ? "DRAFT_OR_HOLD" : "WAITING_REVIEWER",
          ball_owner: fb.state === "DRAFT" ? "HOLD" : "REVIEWER",
          sub_reason: fb.state === "DRAFT" ? "draft" : "zero_review"
        };
      }
      return {
        key: key, st: st, issues: issues,
        maxSevRank: maxSevRank, bestDiffRank: bestDiffRank,
        hasRealBug: hasRealBug, subsystems: Object.keys(subSet)
      };
    });
  }

  function getPrShortChipLabel(st) {
    if (!st) return "";
    if (st.blocker_stage === "CI_FAILED") {
      return t("report.prBoard.chipShort.CI_FAILED", { count: (st.failed_checks || []).length || 1 });
    }
    if (st.blocker_stage === "WAITING_REVIEWER") {
      if (st.sub_reason === "zero_review") return t("report.prBoard.chipShort.WAITING_REVIEWER_zero");
      if (st.sub_reason === "re_review") return t("report.prBoard.chipShort.WAITING_REVIEWER_re");
    }
    return t("report.prBoard.chipShort." + st.blocker_stage);
  }

  function getPrBlockerDetail(st) {
    if (!st) return "";
    var sr = st.sub_reason || "";
    var gates = (st.gate_labels || []).map(function(g) { return g.replace("do-not-merge/", ""); }).join(", ");
    if (sr === "draft") return t("report.prBoard.detail.draft");
    if (sr === "hold_label") return t("report.prBoard.detail.hold_label", { gates: gates || "hold" });
    if (sr === "merge_conflict") return t("report.prBoard.detail.merge_conflict");
    if (sr === "needs_ok_to_test") return t("report.prBoard.detail.needs_ok_to_test");
    if (sr === "ci_failed") return t("report.prBoard.detail.ci_failed", { count: (st.failed_checks || []).length || 1 });
    if (sr === "changes_requested") {
      var crUsers = fmtUsers(st.changes_requested_by);
      return crUsers ? t("report.prBoard.detail.changes_requested", { users: crUsers }) : t("report.prBoard.detail.changes_requested_anon");
    }
    if (sr === "unresolved_thread") {
      var utUsers = fmtUsers(st.unresolved_by);
      var cnt = st.unresolved_threads || 1;
      return utUsers ? t("report.prBoard.detail.unresolved_thread", { count: cnt, users: utUsers }) : t("report.prBoard.detail.unresolved_thread_anon", { count: cnt });
    }
    if (sr === "gate_label") return t("report.prBoard.detail.gate_label", { gates: gates });
    if (sr === "needs_second_lgtm") {
      var lgtmUsers = fmtUsers(st.lgtm_by);
      return lgtmUsers ? t("report.prBoard.detail.needs_second_lgtm", { users: lgtmUsers }) : t("report.prBoard.detail.needs_second_lgtm_anon");
    }
    if (sr === "zero_review") return t("report.prBoard.detail.zero_review");
    if (sr === "re_review") {
      var revUsers = fmtUsers(st.reviewed_by);
      return revUsers ? t("report.prBoard.detail.re_review", { users: revUsers }) : t("report.prBoard.detail.re_review_anon");
    }
    if (sr === "awaiting_review") {
      var awUsers = fmtUsers(st.reviewed_by);
      return awUsers ? t("report.prBoard.detail.awaiting_review", { users: awUsers }) : t("report.prBoard.detail.awaiting_review_anon");
    }
    if (sr === "ci_running") return t("report.prBoard.detail.ci_running", { count: st.running_checks_count || 1 });
    return t("report.prBoard.detail.merge_queue");
  }

  function setSelectIfValid(id, val) {
    if (!val) return;
    var el = document.getElementById(id);
    if (!el || !el.options) return;
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value === val) {
        el.value = val;
        return;
      }
    }
  }

  var issueSelects = {
    cat: ["catSel", "REAL_ALL"], scope: ["scopeSel", "all"], sub: ["subSel", "all"],
    sev: ["sevSel", "all"], pr: ["prSel", "all"], ass: ["assSel", "all"],
    win: ["updWindowSel", "all"], sort: ["sortSel", "num_desc"]
  };
  var prSelects = {
    stage: ["prStageSel", "ALL"], pscope: ["prScopeSel", "mainline"], ball: ["prBallSel", "all"],
    psev: ["prSevSel", "all"], psub: ["prSubSel", "all"], psort: ["prSortSel", "prio_desc"]
  };

  var boardSelects = Object.assign({}, issueSelects, prSelects);

  var issueFlags = ["retriage", "unlabeled"];

  function matchesSeverity(value, severity) {
    if (value === "all") return true;
    if (value === "HIGH_S0_S1") return severity === "CRITICAL" || severity === "MAJOR";
    return value !== "NONE" && value === severity;
  }

  function initStateFromUrl() {
    var sp = new URLSearchParams(window.location.search || "");
    if (sp.get("view") === "prs") activeView = "prs";
    Object.entries(boardSelects).forEach(function([key, control]) {
      setSelectIfValid(control[0], sp.get(key));
    });
    issueFlags.forEach(function(key) { document.getElementById(key).checked = sp.get(key) === "1"; });

    // Legacy matrix filters replaced the category, but intersected with scope and severity.
    var cat = document.getElementById("catSel");
    var sev = document.getElementById("sevSel");
    var diff = sp.get("mdiff"), matrixSev = sp.get("msev");
    var hasDiff = ["EASY", "MEDIUM", "HARD"].includes(diff);
    var hasSev = ["CRITICAL", "MAJOR", "MODERATE", "MINOR"].includes(matrixSev);
    if (sp.get("sev") === "GH_UNLABELED") document.getElementById("unlabeled").checked = true;
    if (sp.get("scope") === "retriage") document.getElementById("retriage").checked = true;
    if (hasDiff || hasSev) {
      cat.value = hasDiff ? diff : "REAL_ALL";
      if (hasSev) sev.value = matchesSeverity(sev.value, matrixSev) ? matrixSev : "NONE";
    } else if (sp.get("cat") === "RETRIAGE") {
      document.getElementById("retriage").checked = true;
      cat.value = "ALL";
    } else if (sp.get("scope") === "retriage" && !sp.get("cat")) {
      cat.value = "ALL";
    }
    if (sp.get("since")) {
      document.getElementById("sinceDate").value = sp.get("since");

  function syncUrlState() {
    var proto = window.location.protocol;
    if (proto !== "http:" && proto !== "https:") return;
    var u = new URL(window.location.href);
    var sp = u.searchParams;
    function setOrDel(key, value, defaultValue) {
      if (value && value !== defaultValue) sp.set(key, value);
      else sp.delete(key);
    }
    sp.delete("mdiff");
    sp.delete("msev");
    setOrDel("view", activeView, "issues");
    Object.entries(boardSelects).forEach(function([key, control]) {
      setOrDel(key, document.getElementById(control[0]).value, control[1]);
    });
    issueFlags.forEach(function(key) { setOrDel(key, document.getElementById(key).checked ? "1" : "", ""); });
    setOrDel("since", document.getElementById("updWindowSel").value === "custom" ? document.getElementById("sinceDate").value : "", "");
    setOrDel("q", document.getElementById("q").value.trim(), "");
    setOrDel("pq", document.getElementById("prQ").value.trim(), "");
    if (window.location.href !== u.href) {
      // Embedded and sandboxed reports may not allow history changes.
      try { window.history.replaceState(null, "", u.href); } catch (_) {}
    }
  }

  var trendPlot = document.getElementById("bugTrendPlot");
  var trendReset = document.getElementById("trendReset");
  var trendReadout = document.getElementById("bugTrendLatest");
  var trendChart, trendHistory, trendAppearance, dragStartDate;

  function trendDate(ms) {
    return new Date(ms).toISOString().slice(0, 10);
  }

  function updateTrendReadout() {
    var x = trendChart.scales.x;
    var last = trendHistory[trendHistory.length - 1];
    trendReset.disabled = !trendChart.isZoomedOrPanned();
    trendReadout.textContent = trendReset.disabled ? last.date + " · " + last.count :
      trendDate(x.min) + " — " + trendDate(x.max);
  }

  trendReset.addEventListener("click", function() { trendChart.resetZoom(); });

  // The plugin draws the selection. Show the dates at its edges while dragging.
  trendPlot.addEventListener("mousemove", function(event) {
    if (!trendChart || !event.buttons || dragStartDate == null) return;
    var x = trendChart.scales.x;
    var end = x.getValueForPixel(Math.max(x.left, Math.min(x.right, event.offsetX)));
    trendReadout.textContent = [dragStartDate, trendDate(end)].sort().join(" — ");
  });
  function finishTrendDrag() {
    if (dragStartDate != null && trendChart) updateTrendReadout();
    dragStartDate = null;
  }
  document.addEventListener("mouseup", finishTrendDrag);
  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") finishTrendDrag();
  });

  function renderBugTrend() {
    var history = window.REPORT_DATASET.bug_history;
    document.getElementById("bugTrend").hidden = !history || !history.length;
    var appearance = SiteI18n.getLocale() + SiteI18n.getEffectiveTheme();
    if (trendHistory === history && trendAppearance === appearance) return;
    var range = trendChart && trendChart.isZoomedOrPanned() && history === trendHistory ?
      {min: trendChart.scales.x.min, max: trendChart.scales.x.max} : null;
    if (trendChart) trendChart.destroy();
    trendChart = null;
    dragStartDate = null;
    trendHistory = history;
    trendAppearance = appearance;
    if (!history || !history.length) return;

    var style = getComputedStyle(trendPlot);
    var accent = style.getPropertyValue("--accent").trim();
    var ticks = style.getPropertyValue("--muted").trim();
    var grid = style.getPropertyValue("--border").trim();
    trendChart = new Chart(trendPlot, {
      type: "line",
      data: { datasets: [{ data: history.map(function(p) { return {x: Date.parse(p.date), y: p.count}; }),
        borderColor: accent, backgroundColor: accent, borderWidth: 2, pointRadius: 3 }] },
      options: {
        locale: SiteI18n.getLocale(), responsive: true, maintainAspectRatio: false,
        animation: false, parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
        scales: {
          x: {type: "time", adapters: {date: {zone: "utc"}}, time: {minUnit: "day", displayFormats: {day: "MM-dd"}},
            ticks: {color: ticks, align: "inner", maxTicksLimit: 7, maxRotation: 0}, grid: {display: false}},
          y: {ticks: {color: ticks, precision: 0, maxTicksLimit: 4}, grid: {color: grid}}
        },
        plugins: {
          legend: {display: false},
          tooltip: {displayColors: false, callbacks: {
            title: function(items) { return trendDate(items[0].parsed.x); },
            label: function(item) { return String(item.parsed.y); }
          }},
          zoom: {limits: {x: {min: "original", max: "original", minRange: 86400000}},
            zoom: {mode: "x", drag: {enabled: true, threshold: 4}, pinch: {enabled: true},
              onZoomStart: function(ctx) {
                if (ctx.point) dragStartDate = trendDate(ctx.chart.scales.x.getValueForPixel(ctx.point.x));
                return history.length > 1;
              },
              onZoomComplete: function() { dragStartDate = null; updateTrendReadout(); }
            }}
        }
      }
    });
    if (range) trendChart.zoomScale("x", range, "none");
    updateTrendReadout();
  }
