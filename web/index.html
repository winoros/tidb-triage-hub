<!DOCTYPE html>
<html lang="en" data-i18n-title="report.meta.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiDB Optimizer Issue Triage &amp; PR Status Hub</title>
<meta name="description" data-i18n-content="report.meta.description" content="Standalone triage & PR blocker workbench for open pingcap/tidb optimizer issues.">
<style>
  :root {
    color-scheme: light dark;
    --header-h: 56px;

    --bg: #f8fafc;
    --bg-elevated: #ffffff;
    --surface: #f1f5f9;
    --surface-hover: #e8eef5;
    --surface-subtle: #f8fafc;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-secondary: #334155;
    --muted: #64748b;
    --link: #2563eb;
    --link-hover: #1d4ed8;
    --accent-ring: rgba(37, 99, 235, 0.22);
    --header-bg: rgba(255, 255, 255, 0.88);
    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);

    --easy-bg: #ecfdf5; --easy-fg: #047857; --easy-bd: #a7f3d0;
    --med-bg: #fffbeb;  --med-fg: #b45309; --med-bd: #fde68a;
    --hard-bg: #fef2f2; --hard-fg: #be123c; --hard-bd: #fecdd3;
    --enh-bg: #eff6ff;  --enh-fg: #1d4ed8; --enh-bd: #bfdbfe;
    --flt-bg: #f1f5f9;  --flt-fg: #475569; --flt-bd: #cbd5e1;

    --sev-crit-bg: #fff1f2; --sev-crit-fg: #be123c; --sev-crit-bd: #fecdd3;
    --sev-maj-bg: #fff7ed;  --sev-maj-fg: #c2410c;  --sev-maj-bd: #fed7aa;
    --sev-mod-bg: #eff6ff;  --sev-mod-fg: #1d4ed8;  --sev-mod-bd: #bfdbfe;
    --sev-min-bg: #f8fafc;  --sev-min-fg: #475569;  --sev-min-bd: #cbd5e1;

    --pr-open-bg: #ecfdf5;   --pr-open-fg: #047857;   --pr-open-bd: #a7f3d0;
    --pr-merged-bg: #f5f3ff; --pr-merged-fg: #6d28d9; --pr-merged-bd: #ddd6fe;
    --pr-draft-bg: #f0f9ff;  --pr-draft-fg: #0369a1;  --pr-draft-bd: #bae6fd;
    --pr-closed-bg: #f1f5f9; --pr-closed-fg: #64748b; --pr-closed-bd: #cbd5e1;

    --qw-bg: #fffbeb;
    --qw-hover: #fef3c7;
    --flash-bg: rgba(37, 99, 235, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f17;
      --bg-elevated: #111722;
      --surface: #171f2e;
      --surface-hover: #1e293b;
      --surface-subtle: #0f1520;
      --border: #232f42;
      --border-strong: #334155;
      --text: #e2e8f0;
      --text-secondary: #cbd5e1;
      --muted: #8b9bb0;
      --link: #60a5fa;
      --link-hover: #93c5fd;
      --accent-ring: rgba(96, 165, 250, 0.28);
      --header-bg: rgba(11, 15, 23, 0.86);
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.36);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);

      --easy-bg: #0a281e; --easy-fg: #34d399; --easy-bd: #115e46;
      --med-bg: #2b1f09;  --med-fg: #fbbf24;  --med-bd: #78480f;
      --hard-bg: #2f1119; --hard-fg: #fb7185; --hard-bd: #7f1d32;
      --enh-bg: #10233f;  --enh-fg: #60a5fa;  --enh-bd: #1e3a8a;
      --flt-bg: #18202f;  --flt-fg: #94a3b8;  --flt-bd: #2d3a4f;

      --sev-crit-bg: #350f1c; --sev-crit-fg: #fda4af; --sev-crit-bd: #881337;
      --sev-maj-bg: #321809;  --sev-maj-fg: #fdba74;  --sev-maj-bd: #7c2d12;
      --sev-mod-bg: #112240;  --sev-mod-fg: #93c5fd;  --sev-mod-bd: #1e3a8a;
      --sev-min-bg: #18202f;  --sev-min-fg: #94a3b8;  --sev-min-bd: #334155;

      --pr-open-bg: #0a291e;   --pr-open-fg: #4ade80;   --pr-open-bd: #165b3d;
      --pr-merged-bg: #23163b; --pr-merged-fg: #c4b5fd; --pr-merged-bd: #4c2882;
      --pr-draft-bg: #112437;  --pr-draft-fg: #7dd3fc;  --pr-draft-bd: #1e466e;
      --pr-closed-bg: #18202f; --pr-closed-fg: #8b9bb0; --pr-closed-bd: #2e3b4e;

      --qw-bg: #1e190d;
      --qw-hover: #292211;
      --flash-bg: rgba(96, 165, 250, 0.2);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0f17;
    --bg-elevated: #111722;
    --surface: #171f2e;
    --surface-hover: #1e293b;
    --surface-subtle: #0f1520;
    --border: #232f42;
    --border-strong: #334155;
    --text: #e2e8f0;
    --text-secondary: #cbd5e1;
    --muted: #8b9bb0;
    --link: #60a5fa;
    --link-hover: #93c5fd;
    --accent-ring: rgba(96, 165, 250, 0.28);
    --header-bg: rgba(11, 15, 23, 0.86);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.28);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.36);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);

    --easy-bg: #0a281e; --easy-fg: #34d399; --easy-bd: #115e46;
    --med-bg: #2b1f09;  --med-fg: #fbbf24;  --med-bd: #78480f;
    --hard-bg: #2f1119; --hard-fg: #fb7185; --hard-bd: #7f1d32;
    --enh-bg: #10233f;  --enh-fg: #60a5fa;  --enh-bd: #1e3a8a;
    --flt-bg: #18202f;  --flt-fg: #94a3b8;  --flt-bd: #2d3a4f;

    --sev-crit-bg: #350f1c; --sev-crit-fg: #fda4af; --sev-crit-bd: #881337;
    --sev-maj-bg: #321809;  --sev-maj-fg: #fdba74;  --sev-maj-bd: #7c2d12;
    --sev-mod-bg: #112240;  --sev-mod-fg: #93c5fd;  --sev-mod-bd: #1e3a8a;
    --sev-min-bg: #18202f;  --sev-min-fg: #94a3b8;  --sev-min-bd: #334155;

    --pr-open-bg: #0a291e;   --pr-open-fg: #4ade80;   --pr-open-bd: #165b3d;
    --pr-merged-bg: #23163b; --pr-merged-fg: #c4b5fd; --pr-merged-bd: #4c2882;
    --pr-draft-bg: #112437;  --pr-draft-fg: #7dd3fc;  --pr-draft-bd: #1e466e;
    --pr-closed-bg: #18202f; --pr-closed-fg: #8b9bb0; --pr-closed-bd: #2e3b4e;

    --qw-bg: #1e190d;
    --qw-hover: #292211;
    --flash-bg: rgba(96, 165, 250, 0.2);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13.5px; line-height: 1.55;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  body.drawer-open { overflow: hidden; }

  a { color: var(--link); text-decoration: none; transition: color 0.12s ease; }
  a:hover { color: var(--link-hover); text-decoration: underline; }

  code, .inline-code {
    font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 11.5px; background: var(--surface);
    color: var(--text-secondary);
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border);
    overflow-wrap: anywhere;
  }

  button, select, input, textarea {
    font-family: inherit;
  }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 1px;
  }

  .ico {
    display: inline-block; width: 14px; height: 14px;
    vertical-align: -2px; flex-shrink: 0;
  }
  .ico-lg { width: 16px; height: 16px; vertical-align: -3px; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
  .is-spinning .ico { animation: spin360 0.85s linear infinite; }

  /* ==================== STICKY APP HEADER ==================== */
  .app-header {
    position: sticky; top: 0; z-index: 40;
    background: var(--header-bg);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1380px; margin: 0 auto; padding: 2px 20px;
    min-height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; position: relative;
  }
  .header-left {
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  .brand-wrap {
    display: inline-flex; align-items: center; gap: 9px;
  }
  .brand-logo {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.32); flex-shrink: 0;
  }
  .brand-title {
    font-weight: 700; font-size: 14.5px; color: var(--text); letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .rw-badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 22px; min-width: 80px; padding: 0 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; line-height: 1;
    background: var(--easy-bg); color: var(--easy-fg); border: 1px solid var(--easy-bd);
    white-space: nowrap;
  }
  .rw-badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0;
  }
  .rw-badge.ro {
    background: var(--flt-bg); color: var(--flt-fg); border-color: var(--flt-bd);
  }

  /* Segmented Primary View Tabs */
  .view-tabs {
    display: inline-flex; align-items: center; height: 34px; padding: 3px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    gap: 2px; max-width: 100%;
  }
  .view-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; color: var(--muted); border: none;
    height: 28px; padding: 0 11px; border-radius: 6px;
    font-size: 12.5px; font-weight: 600; line-height: 1; cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease, box-shadow 0.14s ease; white-space: nowrap;
  }
  .view-tab:hover { color: var(--text); }
  .view-tab.active {
    background: var(--bg-elevated); color: var(--text);
    box-shadow: var(--shadow-xs);
  }
  .tab-cnt {
    display: inline-flex; align-items: center; justify-content: center;
    height: 18px; min-width: 28px;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
    padding: 0 6px; border-radius: 999px; line-height: 1;
    background: var(--border); color: var(--text-secondary);
  }
  .view-tab.active .tab-cnt {
    background: var(--enh-bg); color: var(--enh-fg);
  }

  /* Header Right Utilities */
  .header-right {
    display: flex; align-items: center; gap: 5px; flex: none;
  }
  #rwBar { display: inline-flex; align-items: center; gap: 6px; }
  #githubIdentity {
    max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hdr-divider {
    width: 1px; height: 18px; background: var(--border); margin: 0 1px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--bg-elevated); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px;
    height: 30px; padding: 0 9px; font-size: 12px; font-weight: 500; line-height: 1;
    cursor: pointer; transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease; white-space: nowrap;
    box-shadow: var(--shadow-xs);
  }
  .btn:hover:not(:disabled) {
    background: var(--surface-hover); color: var(--text); border-color: var(--border-strong);
  }
  .btn:disabled { opacity: 0.55; cursor: wait; }
  .btn-icon { width: 30px; padding: 0; }
  .btn-primary {
    background: var(--link); color: #ffffff; border-color: var(--link); font-weight: 600;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--link-hover); border-color: var(--link-hover); color: #ffffff;
  }
  .btn-amber {
    background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); font-weight: 600;
  }
  .btn-amber:hover:not(:disabled) {
    background: var(--qw-hover); color: var(--med-fg); border-color: var(--med-fg);
  }
  .btn-danger-ghost {
    color: var(--hard-fg); border-color: var(--hard-bd); background: var(--hard-bg);
  }
  .btn-danger-ghost:hover:not(:disabled) {
    filter: brightness(0.96); color: var(--hard-fg);
  }
  .btn-badge {
    display: inline-flex; align-items: center; justify-content: center;
    height: 17px; min-width: 18px;
    font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1;
    padding: 0 5px; border-radius: 999px; background: var(--surface); color: var(--text);
  }
  .btn-amber .btn-badge {
    background: rgba(180, 83, 9, 0.16); color: var(--med-fg);
  }

  .lang-switch {
    display: inline-flex; align-items: center; height: 30px; padding: 2px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--surface);
  }
  .lang-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; min-width: 28px;
    background: transparent; color: var(--muted); border: none;
    padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; line-height: 1; transition: background 0.12s ease, color 0.12s ease;
  }
  .lang-btn:hover { color: var(--text); }
  .lang-btn.active {
    background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-xs);
  }

  /* ==================== MAIN LAYOUT & SYNC POPOVER ==================== */
  .wrap {
    max-width: 1380px; margin: 0 auto; padding: 14px 20px 64px;
  }

  .context-strip {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px 16px; min-height: 38px;
    padding: 7px 12px; margin-bottom: 14px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow-xs);
    font-size: 12px; line-height: 20px; color: var(--muted);
  }
  .ctx-left, .ctx-right {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; line-height: 20px;
  }
  .ctx-right { margin-left: auto; }
  .ctx-item {
    display: inline-flex; align-items: center; gap: 5px; line-height: 20px;
  }
  .ctx-item b { color: var(--text-secondary); font-weight: 600; }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--easy-fg);
    box-shadow: 0 0 0 2px var(--easy-bg); flex-shrink: 0;
  }
  .copy-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 5px;
    height: 22px; padding: 0 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1; cursor: pointer; transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
    max-width: 100%; word-break: break-all;
  }
  .copy-chip:hover { border-color: var(--link); color: var(--link); background: var(--enh-bg); }
  .copy-chip.copied { border-color: var(--easy-bd); color: var(--easy-fg); background: var(--easy-bg); }

  .sync-pop-wrap { position: relative; display: inline-flex; align-items: center; }
  .delta-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 22px; min-width: 98px; padding: 0 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; line-height: 1; cursor: pointer;
    background: var(--enh-bg); color: var(--enh-fg); border: 1px solid var(--enh-bd);
    transition: filter 0.12s ease; white-space: nowrap;
  }
  .delta-pill:hover { filter: brightness(0.96); }
  .sync-popover {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;
    width: 440px; max-width: calc(100vw - 24px);
    background: var(--bg-elevated); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 14px; box-shadow: var(--shadow-lg);
    color: var(--text); font-size: 12.5px;
  }
  .sync-popover h3 {
    margin: 0 0 10px; font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .delta-sec { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .delta-sec h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .delta-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow-y: auto; }
  .delta-list li {
    font-size: 12px; line-height: 1.45; padding: 5px 8px;
    background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px;
  }

  /* ==================== INTERACTIVE OVERVIEW PANELS ==================== */
  .overview-wrap { margin-bottom: 14px; }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px; margin-bottom: 10px;
  }
  .kpi {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; min-height: 88px; text-align: left;
    cursor: pointer; transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease; box-shadow: var(--shadow-xs);
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden; color: var(--text);
  }
  .kpi:hover {
    border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm);
  }
  .kpi.active {
    border-color: var(--link); box-shadow: 0 0 0 2px var(--accent-ring);
  }
  .kpi .lbl {
    font-size: 11.5px; font-weight: 600; line-height: 17px; min-height: 17px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi .val {
    font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em; margin: 4px 0 3px; line-height: 26px;
  }
  .kpi .val-sub {
    font-size: 12.5px; font-weight: 500; color: var(--muted);
  }
  .kpi .hint {
    font-size: 11px; color: var(--muted); line-height: 16px; min-height: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Distribution Strip */
  .dist-card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
    box-shadow: var(--shadow-xs);
  }
  .funnel-bar {
    display: flex; width: 100%; height: 8px; border-radius: 999px;
    overflow: hidden; margin-bottom: 8px; background: var(--surface); gap: 1px;
  }
  .funnel-seg {
    height: 100%; cursor: pointer; transition: opacity 0.14s ease;
  }
  .funnel-seg:hover { opacity: 0.82; }
  .legend {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px;
    font-size: 12px; color: var(--muted);
  }
  .legend-items { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .lg-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; line-height: 1; white-space: nowrap;
    background: none; border: none; padding: 0 5px; border-radius: 4px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
  }
  .lg-btn:hover { background: var(--surface); color: var(--text); }
  .lg-btn b { font-variant-numeric: tabular-nums; color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* Priority Matrix + Integrated Rubric */
  .matrix-box {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow-xs);
  }
  .matrix-head {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; min-height: 30px; margin-bottom: 10px;
  }
  .matrix-head-left {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; line-height: 20px;
  }
  .matrix-title { font-size: 13.5px; font-weight: 700; line-height: 20px; color: var(--text); }
  .matrix-sub { font-size: 12px; line-height: 18px; color: var(--muted); }
  .matrix-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.mtx {
    width: 100%; min-width: 580px; border-collapse: separate; border-spacing: 0;
    table-layout: fixed; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  table.mtx th, table.mtx td {
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 7px 9px; text-align: center; vertical-align: middle; font-size: 12px;
  }
  table.mtx tbody tr > * { height: 54px; }
  table.mtx tbody tr:last-child > * { height: 48px; border-bottom: none; }
  table.mtx tr > :last-child { border-right: none; }
  table.mtx thead th {
    background: var(--surface-subtle); color: var(--text-secondary);
    font-weight: 600; font-size: 11.5px; line-height: 18px; height: 35px; padding: 7px 8px;
    white-space: nowrap;
  }
  table.mtx th.row-hdr {
    text-align: left; width: 164px; background: var(--surface-subtle); color: var(--text);
  }
  .rh-main { display: flex; align-items: center; gap: 6px; font-weight: 600; line-height: 17px; white-space: nowrap; }
  .rh-sub { display: block; font-size: 11px; font-weight: 400; line-height: 15px; color: var(--muted); margin-left: 14px; white-space: nowrap; }
  table.mtx td.mcell {
    background: var(--bg-elevated); cursor: pointer; position: relative;
    transition: background 0.12s ease, box-shadow 0.12s ease;
  }
  table.mtx td.mcell:hover { background: var(--surface-hover); }
  table.mtx td.mcell.qw { background: var(--qw-bg); }
  table.mtx td.mcell.qw:hover { background: var(--qw-hover); }
  table.mtx td.mcell.active {
    box-shadow: inset 0 0 0 2px var(--link);
    background: var(--enh-bg);
  }
  table.mtx td.mcell-total { background: var(--surface-subtle); }
  .qw-pill {
    position: absolute; top: 4px; right: 5px;
    font-size: 9.5px; font-weight: 700; padding: 0 4px; border-radius: 3px;
    background: var(--med-bg); color: var(--med-fg); border: 1px solid var(--med-bd);
    line-height: 15px; height: 16px; display: inline-flex; align-items: center;
  }
  .mc-num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; line-height: 20px; color: var(--text); }
  .mc-num.zero { color: var(--muted); opacity: 0.45; }
  .mc-sub { font-size: 11px; line-height: 15px; color: var(--muted); display: block; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Inline Collapsible Rubric inside Matrix Box */
  .rubric-drawer {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .analysis-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
  }
  .a-card {
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 6px; padding: 11px 13px; min-width: 0; font-size: 12px; line-height: 1.6;
  }
  .a-card h3 { margin: 0 0 7px; font-size: 12.5px; font-weight: 700; color: var(--text); }
  .a-card ul { margin: 0; padding-left: 16px; color: var(--text-secondary); }
  .a-card li { margin-bottom: 5px; word-break: break-word; }

  /* PR Ball-Owner 4-Court Strip & Symmetrical 5x2 Stage Grid */
  .court-strip {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; margin-bottom: 10px; box-shadow: var(--shadow-xs);
  }
  .court-cards {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px;
  }
  .court-card {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 11px; min-height: 52px; cursor: pointer; text-align: left;
    color: var(--text); transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .court-card:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .court-card.active { border-color: var(--link); box-shadow: 0 0 0 2px var(--accent-ring); background: var(--enh-bg); }
  .cc-title { font-size: 12px; font-weight: 600; line-height: 18px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .cc-sub { font-size: 11px; line-height: 16px; color: var(--muted); display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-val { font-size: 19px; font-weight: 700; line-height: 24px; font-variant-numeric: tabular-nums; }

  .stage-grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px; margin-bottom: 14px;
  }
  .stage-card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; min-height: 62px; cursor: pointer; text-align: left;
    color: var(--text); box-shadow: var(--shadow-xs);
    transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease; position: relative; overflow: hidden;
  }
  .stage-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--stage-accent, var(--border-strong));
  }
  .stage-card:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .stage-card.active {
    border-color: var(--link); box-shadow: 0 0 0 2px var(--accent-ring);
    background: var(--enh-bg);
  }
  .stage-card .sc-lbl {
    font-size: 11.5px; font-weight: 500; line-height: 17px; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stage-card .sc-row {
    display: flex; align-items: baseline; justify-content: space-between; margin-top: 3px;
  }
  .stage-card .sc-val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 24px; }
  .stage-card .sc-pct { font-size: 11px; line-height: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ==================== FILTER TOOLBAR & ACTIVE CHIPS ==================== */
  .controls {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow-xs);
  }
  .ctrl-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }

  .search-wrap {
    position: relative; flex: 1 1 260px; display: flex; align-items: center; min-width: 200px;
  }
  .search-wrap .search-ico {
    position: absolute; left: 9px; color: var(--muted); pointer-events: none; display: inline-flex;
  }
  .search-wrap input[type="search"] {
    width: 100%; height: 32px; padding: 0 54px 0 30px;
    background: var(--surface-subtle); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; line-height: 18px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .search-wrap input[type="search"]:focus {
    background: var(--bg-elevated); border-color: var(--link);
  }
  .search-wrap input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .kbd-hint {
    position: absolute; right: 8px; padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: var(--muted); background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; pointer-events: none; line-height: 1.3;
  }
  .search-clear {
    position: absolute; right: 6px; background: var(--surface); color: var(--muted);
    border: none; border-radius: 4px; width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .search-clear:hover { color: var(--text); background: var(--surface-hover); }

  select, input[type="date"], input[type="text"], input[type="password"], textarea {
    background: var(--surface-subtle); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px; font-size: 12px; line-height: 18px; min-width: 0; max-width: 100%;
    transition: border-color 0.12s ease;
  }
  select, input[type="text"], input[type="password"] { height: 32px; padding-top: 0; padding-bottom: 0; }
  select:hover, input[type="date"]:hover, input[type="text"]:hover, input[type="password"]:hover { border-color: var(--border-strong); }
  .date-grp {
    display: inline-flex; align-items: center; gap: 5px;
    height: 32px; font-size: 12px; line-height: 1; color: var(--muted);
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 6px; padding: 0 7px;
  }
  .date-grp input[type="date"] { border: none; background: transparent; padding: 3px 2px; }

  .pills-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 28px;
    padding-top: 4px; border-top: 1px dashed var(--border);
  }
  .pill-sep { width: 1px; height: 16px; background: var(--border); margin: 0 3px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--surface-subtle); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 999px;
    height: 24px; padding: 0 10px; font-size: 11.5px; font-weight: 500; line-height: 1; cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease; white-space: nowrap;
  }
  .pill:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border-strong); }
  .pill .p-cnt {
    font-size: 10.5px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600;
  }
  .pill.active {
    background: var(--text); color: var(--bg-elevated);
    border-color: var(--text); font-weight: 600;
  }
  .pill.active .p-cnt { color: var(--bg-elevated); opacity: 0.82; }

  /* Status & Active Filter Chips Bar */
  .status-line {
    font-size: 12px; line-height: 20px; min-height: 24px; color: var(--muted); margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .status-left {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .count-strong { font-weight: 600; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .active-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--enh-bg); color: var(--enh-fg); border: 1px solid var(--enh-bd);
    padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  }
  .active-chip button {
    background: none; border: none; color: inherit; cursor: pointer;
    padding: 0; display: inline-flex; align-items: center; opacity: 0.75;
  }
  .active-chip button:hover { opacity: 1; }
  .reset-link-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: none; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text-secondary); padding: 2px 9px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; transition: all 0.12s ease;
  }
  .reset-link-btn:hover { border-color: var(--hard-fg); color: var(--hard-fg); background: var(--hard-bg); }

  /* ==================== STICKY DATA TABLES ==================== */
  .tbl-card {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow-xs);
  }
  table.issues-tbl, table.prs-tbl {
    width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed;
  }
  table.issues-tbl th, table.issues-tbl td,
  table.prs-tbl th, table.prs-tbl td {
    text-align: left; padding: 10px 10px;
    border-bottom: 1px solid var(--border); vertical-align: top; word-break: break-word;
  }
  table.issues-tbl tbody tr:last-child td,
  table.prs-tbl tbody tr:last-child td { border-bottom: none; }

  table.issues-tbl thead th, table.prs-tbl thead th {
    position: sticky; top: calc(var(--header-h, 54px) - 1px); z-index: 15;
    font-size: 11.5px; line-height: 18px; height: 36px; color: var(--muted); font-weight: 600;
    background: var(--surface); border-bottom: 1px solid var(--border-strong);
    box-shadow: 0 -1px 0 var(--border);
    padding: 8px 10px; user-select: none; white-space: nowrap;
  }

  th.sortable { cursor: pointer; transition: color 0.12s ease, background 0.12s ease; }
  th.sortable:hover { color: var(--text); background: var(--surface-hover); }
  th.sortable.sorted { color: var(--link); }
  .th-in { display: inline-flex; align-items: center; gap: 4px; }
  .sort-ind { font-size: 11px; opacity: 0.55; }
  th.sortable.sorted .sort-ind { opacity: 1; }

  col.c-id { width: 98px; }
  col.c-cat { width: 176px; }
  col.c-sub { width: 192px; }
  col.c-title { width: auto; }
  col.c-time { width: 168px; }

  col.p-id { width: 134px; }
  col.p-blk { width: 228px; }
  col.p-iss { width: 178px; }
  col.p-det { width: auto; }
  col.p-time { width: 158px; }

  table.issues-tbl tbody tr, table.prs-tbl tbody tr {
    transition: background 0.1s ease;
  }
  table.issues-tbl tbody tr:hover td, table.prs-tbl tbody tr:hover td {
    background: var(--surface-subtle);
  }
  @keyframes rowFlashPulse {
    0% { background: var(--flash-bg); }
    65% { background: var(--flash-bg); }
    100% { background: transparent; }
  }
  tr.row-flash td { animation: rowFlashPulse 2.2s ease-out; }

  /* Row Cells & Badges */
  .id-num-link {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700; font-size: 13px; color: var(--link);
    display: inline-flex; align-items: center; gap: 3px;
  }
  .row-act-btn {
    margin-top: 5px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 22px; min-width: 64px; padding: 0 7px; font-size: 11px; font-weight: 500; line-height: 1;
    background: var(--surface); color: var(--muted); white-space: nowrap;
    border: 1px solid var(--border); border-radius: 5px; cursor: pointer;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .row-act-btn:hover { color: var(--link); border-color: var(--link); background: var(--enh-bg); }

  .cls-stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .cls-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 21px; min-width: 58px; padding: 0 7px; border-radius: 5px;
    font-size: 11px; font-weight: 600; line-height: 1; border: 1px solid transparent; white-space: nowrap;
  }
  .badge-easy { background: var(--easy-bg); color: var(--easy-fg); border-color: var(--easy-bd); }
  .badge-medium { background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); }
  .badge-hard { background: var(--hard-bg); color: var(--hard-fg); border-color: var(--hard-bd); }
  .badge-enh { background: var(--enh-bg); color: var(--enh-fg); border-color: var(--enh-bd); }
  .badge-fuzz, .badge-ai, .badge-other { background: var(--flt-bg); color: var(--flt-fg); border-color: var(--flt-bd); }

  .sev-badge {
    display: inline-flex; align-items: center; justify-content: center;
    height: 21px; min-width: 78px; padding: 0 6px; border-radius: 5px;
    font-size: 11px; font-weight: 700; line-height: 1; border: 1px solid transparent;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .sev-critical { background: var(--sev-crit-bg); color: var(--sev-crit-fg); border-color: var(--sev-crit-bd); }
  .sev-major { background: var(--sev-maj-bg); color: var(--sev-maj-fg); border-color: var(--sev-maj-bd); }
  .sev-moderate { background: var(--sev-mod-bg); color: var(--sev-mod-fg); border-color: var(--sev-mod-bd); }
  .sev-minor { background: var(--sev-min-bg); color: var(--sev-min-fg); border-color: var(--sev-min-bd); }
  .sev-na { background: var(--flt-bg); color: var(--flt-fg); border-color: var(--flt-bd); }
  .gh-sev-note { font-size: 10.5px; line-height: 15px; color: var(--muted); }

  .sub-chip {
    display: inline-flex; align-items: center; text-align: left;
    background: var(--surface); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 6px;
    min-height: 24px; padding: 3px 8px; font-size: 11.5px; font-weight: 500; cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease; line-height: 16px;
  }
  .sub-chip:hover { border-color: var(--link); color: var(--link); background: var(--enh-bg); }

  .iss-title-link {
    color: var(--text); font-weight: 600; font-size: 13.5px; line-height: 1.42;
  }
  .iss-title-link:hover { color: var(--link); text-decoration: underline; }
  .iss-title-link code { font-weight: 500; }

  .note-callout {
    margin-top: 5px; padding: 4px 8px;
    border-left: 2px solid var(--border-strong);
    background: var(--surface-subtle); border-radius: 0 4px 4px 0;
    font-size: 12px; color: var(--text-secondary); line-height: 1.48;
  }

  .tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
  .tag-mini {
    display: inline-flex; align-items: center; gap: 3px;
    height: 19px; padding: 0 6px; border: 1px solid var(--border);
    border-radius: 4px; font-size: 11px; color: var(--muted); background: var(--bg-elevated);
    line-height: 1; white-space: nowrap;
  }
  .tag-cust { border-color: var(--hard-bd); color: var(--hard-fg); background: var(--hard-bg); font-weight: 600; }
  .tag-keep { border-color: var(--enh-bd); color: var(--enh-fg); background: var(--enh-bg); font-weight: 600; }
  .tag-cal { border-color: var(--easy-bd); color: var(--easy-fg); background: var(--easy-bg); font-weight: 600; }
  .tag-repo { border-color: var(--pr-merged-bd); color: var(--pr-merged-fg); background: var(--pr-merged-bg); font-weight: 600; }
  .tag-retriage { border-color: var(--med-bd); color: var(--med-fg); background: var(--med-bg); font-weight: 600; }
  .pill.pill-retriage:not(.active) { border-color: var(--med-bd); color: var(--med-fg); background: var(--med-bg); font-weight: 600; }
  .pill.pill-retriage:not(.active) .p-cnt { color: var(--med-fg); }
  .tag-wait-warn { border-color: var(--med-bd); color: var(--med-fg); background: var(--med-bg); font-weight: 600; }
  .tag-wait-crit { border-color: var(--sev-crit-bd); color: var(--sev-crit-fg); background: var(--sev-crit-bg); font-weight: 600; }

  /* Split PR / Issue Chips */
  .pr-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .pr-chip-grp { display: inline-flex; align-items: stretch; border-radius: 5px; overflow: hidden; }
  .pr-chip {
    display: inline-flex; align-items: center; gap: 4px;
    height: 22px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600;
    border: 1px solid transparent; text-decoration: none;
    font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
  }
  .pr-chip-grp .pr-chip { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .pr-jump-btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-left: none;
    background: var(--surface); color: var(--muted);
    border-top-right-radius: 5px; border-bottom-right-radius: 5px;
    padding: 0 6px; cursor: pointer; transition: all 0.12s ease;
  }
  .pr-jump-btn:hover { color: var(--link); background: var(--enh-bg); border-color: var(--enh-bd); }
  .pr-chip:hover { text-decoration: underline; filter: brightness(0.97); }

  .pr-open { background: var(--pr-open-bg); color: var(--pr-open-fg); border-color: var(--pr-open-bd); }
  .pr-merged { background: var(--pr-merged-bg); color: var(--pr-merged-fg); border-color: var(--pr-merged-bd); }
  .pr-draft { background: var(--pr-draft-bg); color: var(--pr-draft-fg); border-color: var(--pr-draft-bd); border-style: dashed; }
  .pr-closed { background: var(--pr-closed-bg); color: var(--pr-closed-fg); border-color: var(--pr-closed-bd); font-weight: 500; }
  .pr-unknown { background: var(--pr-closed-bg); color: var(--pr-closed-fg); border-color: var(--pr-closed-bd); border-style: dashed; font-weight: 500; }
  .pr-danger { background: var(--sev-crit-bg); color: var(--sev-crit-fg); border-color: var(--sev-crit-bd); }
  .pr-warn { background: var(--sev-maj-bg); color: var(--sev-maj-fg); border-color: var(--sev-maj-bd); }
  .pr-lgtm1 { background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); }
  .pr-rev { background: var(--enh-bg); color: var(--enh-fg); border-color: var(--enh-bd); }

  .ci-fail-chip {
    display: inline-flex; align-items: center; gap: 4px;
    height: 21px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; line-height: 1;
    background: var(--sev-crit-bg); color: var(--sev-crit-fg); border: 1px solid var(--sev-crit-bd);
    text-decoration: none; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ci-fail-chip:hover { text-decoration: underline; }
  .ci-more-btn {
    display: inline-flex; align-items: center; gap: 3px;
    height: 21px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; line-height: 1;
    background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border);
    cursor: pointer; white-space: nowrap;
  }
  .ci-more-btn:hover { border-color: var(--link); color: var(--link); }

  .meta-cell {
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 18px;
  }
  .upd-val { color: var(--text); font-weight: 600; display: block; white-space: nowrap; line-height: 18px; }
  .user-link {
    color: var(--muted); font-weight: 500; line-height: 18px;
    display: inline-block; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom;
  }
  .user-link:hover { color: var(--link); }
  .assignee-pill {
    display: inline-flex; align-items: center; gap: 3px; margin-top: 2px;
    height: 18px; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 1;
    background: var(--enh-bg); color: var(--enh-fg); white-space: nowrap;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
  }
  .empty-state h3 { margin: 8px 0 4px; font-size: 14px; color: var(--text); }
  .empty-state p { margin: 0 0 12px; font-size: 12.5px; }

  /* ==================== SLIDE-OVER DRAWERS & TOAST ==================== */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.48);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    z-index: 90; display: flex; justify-content: flex-end;
  }
  @keyframes slideInRight {
    from { transform: translateX(24px); opacity: 0.6; }
    to { transform: translateX(0); opacity: 1; }
  }
  .drawer-panel {
    width: 540px; max-width: 100vw; height: 100%;
    background: var(--bg-elevated); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-lg); animation: slideInRight 0.16s ease-out;
  }
  .drawer-hdr {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 13px 18px; border-bottom: 1px solid var(--border); background: var(--surface-subtle);
  }
  .drawer-hdr h2 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .drawer-body {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .drawer-meta-card {
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .dm-title { font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--text); }
  .dm-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px;
    font-size: 12px; color: var(--muted);
  }
  .dm-grid b { color: var(--text-secondary); font-weight: 600; }
  .drawer-sec-title {
    font-size: 11.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: -6px;
  }
  .fld-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .fld select, .fld textarea, .fld input[type="text"], .fld input[type="password"] { width: 100%; }
  .fld textarea { min-height: 72px; resize: vertical; line-height: 1.48; }
  .chk-card {
    display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px;
    background: var(--surface-subtle); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 12.5px;
  }
  .chk-card input { margin-top: 3px; }
  .chk-card small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .drawer-ftr {
    padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface-subtle);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .pend-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    background: var(--surface-subtle); display: flex; flex-direction: column; gap: 9px;
  }
  .pend-pre {
    max-height: 190px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px;
    padding: 9px; font-size: 12px; margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sug-banner {
    background: var(--bg-elevated); border: 1px dashed var(--enh-bd); border-radius: 6px;
    padding: 7px 10px; font-size: 11.5px; color: var(--text-secondary);
    display: flex; flex-direction: column; gap: 4px;
  }
  .retriage-banner {
    background: var(--med-bg); border: 1px solid var(--med-bd); border-radius: 8px;
    padding: 11px 13px; display: flex; flex-direction: column; gap: 8px;
  }
  .retriage-banner-hdr {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    font-size: 12.5px; font-weight: 700; color: var(--med-fg);
  }
  .retriage-list {
    margin: 0; padding-left: 16px; font-size: 12px; color: var(--text-secondary);
    display: flex; flex-direction: column; gap: 4px;
  }
  .exclude-zone {
    margin-top: 4px; border: 1px dashed var(--hard-bd); border-radius: 8px;
    padding: 9px 12px; background: var(--surface-subtle);
  }
  .exclude-zone summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--hard-fg);
    user-select: none;
  }
  .exclude-canonical-note {
    margin-top: 4px; padding: 8px 11px; border-radius: 6px;
    border: 1px dashed var(--border); background: var(--surface-subtle);
    font-size: 11.5px; color: var(--muted);
  }
  .inbox-tabs {
    display: flex; align-items: center; gap: 4px; padding: 8px 18px;
    border-bottom: 1px solid var(--border); background: var(--bg-elevated);
  }
  .inbox-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; padding: 0 12px; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    font-variant-numeric: tabular-nums; transition: all 0.12s ease;
  }
  .inbox-tab:hover { color: var(--text); background: var(--surface); }
  .inbox-tab.active {
    background: var(--enh-bg); color: var(--enh-fg); border-color: var(--enh-bd);
  }
  .inbox-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .toast-box {
    position: fixed; bottom: 20px; right: 20px; z-index: 130;
    display: flex; align-items: center; gap: 8px;
    background: var(--text); color: var(--bg-elevated);
    padding: 10px 15px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    box-shadow: var(--shadow-lg); max-width: calc(100vw - 36px);
  }
  .toast-box.toast-err { background: #be123c; color: #ffffff; }

  .back-top-btn {
    position: fixed; bottom: 22px; left: 22px; z-index: 50;
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--bg-elevated); color: var(--text-secondary);
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.14s ease;
  }
  .back-top-btn:hover { background: var(--link); color: #ffffff; border-color: var(--link); transform: translateY(-2px); }

  /* ==================== BILINGUAL GEOMETRY LOCK (DESKTOP) & BREAKPOINTS ==================== */
  @media (min-width: 861px) {
    #toggleRubricBtn { min-width: 146px; }

    .lg-btn[data-lg-cat="EASY"] { min-width: 92px; }
    .lg-btn[data-lg-cat="MEDIUM"] { min-width: 112px; }
    .lg-btn[data-lg-cat="HARD"] { min-width: 92px; }
    .lg-btn[data-lg-cat="ENHANCEMENT"] { min-width: 132px; }
    .lg-btn[data-lg-cat="FILTER_RANDOM_FUZZ"] { min-width: 116px; }

    #scopeSel { width: 224px; }
    #subSel, #prSubSel { width: 214px; }
    #sevSel, #prSevSel { width: 196px; }
    #prSel { width: 212px; }
    #assSel { width: 148px; }
    #updWindowSel { width: 154px; }
    #sortSel { width: 232px; }
    #prScopeSel { width: 244px; }
    #prBallSel { width: 204px; }
    #prSortSel { width: 192px; }

    .pill[data-cat="REAL_ALL"] { min-width: 104px; }
    .pill[data-cat="FILTER_RANDOM_FUZZ"] { min-width: 116px; }
    .pill[data-cat="FILTER_AI_OBSCURE"] { min-width: 124px; }
    .pill[data-cat="FILTER_NON_OPT_OR_FIXED"] { min-width: 146px; }
    .pill[data-cat="RETRIAGE"] { min-width: 96px; }
    .pill[data-cat="ALL"] { min-width: 60px; }

    .sub-chip { white-space: nowrap; }
  }

  #headerMore { display: none; }
  @media (max-width: 1200px) {
    #headerMore { display: inline-flex; }
    .header-right {
      display: none; position: absolute; top: 100%; right: 12px;
      max-height: calc(100dvh - var(--header-h)); overflow-y: auto;
      padding: 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-elevated); box-shadow: var(--shadow-lg);
      grid-template-columns: 1fr auto;
    }
    #headerMore[aria-expanded="true"] + .header-right { display: grid; }
    .header-right > :not(.lang-switch, #themeBtn), #rwBar > .btn { grid-column: 1 / -1; }
    #rwBar { display: contents; }
    #rwBar .hdr-divider { display: none; }
    #githubIdentity { max-width: 22ch; }
    .lang-switch { justify-content: center; }
  }
  @media (max-width: 660px) {
    .brand-title { display: none; }
  }
  @media (max-width: 440px) {
    .view-tab { padding-inline: 6px; }
    .view-tab .ico, .tab-cnt { display: none; }
  }
  @media (max-width: 1120px) {
    .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stage-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .court-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .analysis-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .header-inner { padding-inline: 12px; }
    .wrap { padding: 12px 12px 52px; }
    .stage-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    table.issues-tbl thead, table.prs-tbl thead { display: none; }
    .tbl-card { background: transparent; border: none; box-shadow: none; }
    table.issues-tbl, table.issues-tbl tbody, table.issues-tbl td,
    table.prs-tbl, table.prs-tbl tbody, table.prs-tbl td {
      display: block; width: 100%;
    }
    table.issues-tbl tr, table.prs-tbl tr {
      display: flex; flex-direction: column; gap: 6px;
      border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 10px; background: var(--bg-elevated);
      box-shadow: var(--shadow-xs);
    }
    table.issues-tbl td, table.prs-tbl td { border: none; padding: 0; }
    .fld-grid-2, .dm-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 580px) {
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-grid > .kpi:first-child { grid-column: 1 / -1; }
    .court-cards { grid-template-columns: 1fr; }
    .hdr-divider, .hide-xs { display: none; }
  }
</style>
</head>
<body>
<header class="app-header" id="appHeader">
  <div class="header-inner">
    <div class="header-left">
      <div class="brand-wrap">
        <span class="brand-logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </span>
        <span class="brand-title" data-i18n="common.appBrand">TiDB Optimizer Triage Hub</span>
      </div>

      <div class="view-tabs" role="tablist">
        <button type="button" class="view-tab active" id="tabIssuesBtn" role="tab" aria-selected="true" data-view="issues">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          <span data-i18n="report.views.issuesTab">Issue Triage</span>
          <span class="tab-cnt" id="tabIssuesCnt">0</span>
        </button>
        <button type="button" class="view-tab" id="tabPrsBtn" role="tab" aria-selected="false" data-view="prs">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" y1="9" x2="6" y2="21"></line></svg>
          <span data-i18n="report.views.prsTab">PR Status</span>
          <span class="tab-cnt" id="tabPrsCnt">0</span>
        </button>
      </div>
    </div>

    <button type="button" id="headerMore" class="btn" aria-expanded="false" aria-controls="headerActions" data-i18n="report.nav.more">More</button>
    <div class="header-right" id="headerActions">
      <span class="rw-badge" id="permBadge"></span>
      <div id="rwBar" hidden>
        <button type="button" class="btn btn-amber" id="pendingInboxBtn" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
          <span data-i18n="report.rw.pendingBtn">Inbox</span>
          <span class="btn-badge" id="pendingCntBadge">0</span>
        </button>
        <button type="button" class="btn" id="authLogoutBtn" hidden>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span data-i18n="report.rw.lockBtn">Lock</span>
        </button>
        <span class="hdr-divider"></span>
      </div>

      <a class="btn" id="githubSignInBtn" href="./auth/github" hidden>Sign in with GitHub</a>
      <span id="githubIdentity" hidden></span>
      <button type="button" class="btn" id="authUnlockBtn" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        <span data-i18n="report.rw.unlockBtn">Unlock RW</span>
      </button>

      <button type="button" class="btn" id="toggleOverviewBtn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span id="toggleOverviewLbl"></span>
      </button>

      <div class="lang-switch" role="group" data-i18n-aria-label="common.langSwitchAria" aria-label="Language">
        <button type="button" class="lang-btn" data-lang-opt="zh-CN">中</button>
        <button type="button" class="lang-btn" data-lang-opt="en">EN</button>
      </div>
      <button class="btn btn-icon" id="themeBtn" type="button" data-i18n-aria-label="common.toggleThemeAria" aria-label="Theme"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Compact Single-Line Context & Sync Strip -->
  <div class="context-strip">
    <div class="ctx-left">
      <span class="ctx-item">
        <i class="pulse-dot" aria-hidden="true"></i>
        <b data-i18n="report.sync.snapshotLabel">Issue Snapshot</b>:
        <span id="syncSnapTxt"></span>
      </span>
      <span class="ctx-item" id="prSyncWrap" hidden>
        <b data-i18n="report.sync.prSnapshotLabel">PR Sync</b>:
        <span id="prSyncSnapTxt"></span>
      </span>
      <span class="ctx-item hide-xs" id="pageSub"></span>
    </div>

    <div class="ctx-right">
      <button type="button" class="btn" id="syncPrsBtn" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span id="syncPrsBtnLbl" data-i18n="report.rw.syncPrsBtn">Sync PRs</span>
      </button>
      <button type="button" class="btn" id="syncIssuesBtn" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
        <span id="syncIssuesBtnLbl" data-i18n="report.rw.syncIssuesBtn">Sync Issues</span>
      </button>
      <button type="button" class="copy-chip" id="copySyncBtn" data-i18n-title="report.sync.copyTitle"></button>
      <div class="sync-pop-wrap" id="deltaPopWrap" hidden>
        <button type="button" class="delta-pill" id="deltaTriggerBtn"></button>
        <div class="sync-popover" id="syncPopover" hidden>
          <h3>
            <span data-i18n="report.sync.popoverTitle"></span>
            <button type="button" class="btn btn-icon" id="closeSyncPopBtn" aria-label="Close">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </h3>
          <div style="font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;">
            <div><b style="color:var(--text-secondary)" data-i18n="report.sync.watermarkLabel"></b>: <code id="syncWatermarkCode"></code></div>
          </div>
          <div id="deltaPopoverBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== VIEW 1: ISSUE TRIAGE ==================== -->
  <section id="viewIssuesSection">
    <div class="overview-wrap" id="issuesOverviewWrap">
      <div class="kpi-grid" id="kpis"></div>

      <div class="dist-card">
        <div class="funnel-bar" id="funnelBar"></div>
        <div class="legend">
          <div class="legend-items">
            <button type="button" class="lg-btn" data-lg-cat="EASY"><i class="dot" style="background:var(--easy-fg)"></i><span data-i18n="report.legend.easy"></span> <b id="lg-easy">0</b></button>
            <button type="button" class="lg-btn" data-lg-cat="MEDIUM"><i class="dot" style="background:var(--med-fg)"></i><span data-i18n="report.legend.med"></span> <b id="lg-med">0</b></button>
            <button type="button" class="lg-btn" data-lg-cat="HARD"><i class="dot" style="background:var(--hard-fg)"></i><span data-i18n="report.legend.hard"></span> <b id="lg-hard">0</b></button>
            <button type="button" class="lg-btn" data-lg-cat="ENHANCEMENT"><i class="dot" style="background:var(--enh-fg)"></i><span data-i18n="report.legend.enh"></span> <b id="lg-enh">0</b></button>
            <button type="button" class="lg-btn" data-lg-cat="FILTER_RANDOM_FUZZ"><i class="dot" style="background:var(--flt-fg)"></i><span data-i18n="report.legend.flt"></span> <b id="lg-flt">0</b></button>
          </div>
        </div>
      </div>

      <div class="matrix-box">
        <div class="matrix-head">
          <div class="matrix-head-left">
            <span class="matrix-title" data-i18n="report.matrix.title"></span>
            <span class="matrix-sub" data-i18n-html="report.matrix.subHtml"></span>
          </div>
          <button type="button" class="btn" id="toggleRubricBtn">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <span data-i18n="report.rubric.summary"></span>
          </button>
        </div>

        <div class="matrix-scroll">
          <table class="mtx">
            <thead>
              <tr>
                <th class="row-hdr" data-i18n="report.matrix.corner"></th>
                <th data-i18n="report.matrix.colCrit"></th>
                <th data-i18n="report.matrix.colMaj"></th>
                <th data-i18n="report.matrix.colMod"></th>
                <th data-i18n="report.matrix.colMin"></th>
                <th data-i18n="report.matrix.colTotal"></th>
              </tr>
            </thead>
            <tbody id="mtxBody"></tbody>
          </table>
        </div>

        <div class="rubric-drawer" id="rubricDrawer" hidden>
          <div class="analysis-grid">
            <div class="a-card">
              <h3 data-i18n="report.rubric.scope.title"></h3>
              <ul>
                <li data-i18n-html="report.rubric.scope.fuzzHtml"></li>
                <li data-i18n-html="report.rubric.scope.aiHtml"></li>
                <li data-i18n-html="report.rubric.scope.nonOptHtml"></li>
                <li data-i18n-html="report.rubric.scope.keepHtml"></li>
              </ul>
            </div>
            <div class="a-card">
              <h3 data-i18n="report.rubric.difficulty.title"></h3>

<script>
(function() {
  "use strict";

  function appUrl(subpath) {
    var p = (window.location && window.location.pathname) || "/";
    if (p.slice(-11) === "/index.html") p = p.slice(0, -10);
    if (p.charAt(p.length - 1) !== "/") p += "/";
    return p + String(subpath || "").replace(/^\.?\//, "");
  }

  var moreButton = document.getElementById("headerMore");
  var headerActions = document.getElementById("headerActions");
  function closeHeaderActions() {
    moreButton.setAttribute("aria-expanded", "false");
  }
  moreButton.addEventListener("click", function() {
    moreButton.setAttribute("aria-expanded", moreButton.getAttribute("aria-expanded") !== "true");
  });
  document.addEventListener("click", function(event) {
    if (!event.target.closest("#headerMore, #headerActions")) closeHeaderActions();
  });
  headerActions.addEventListener("click", function(event) {
    if (moreButton.getAttribute("aria-expanded") === "true" && event.target.closest("button, a")) {
      if (headerActions.contains(document.activeElement)) moreButton.focus();
      closeHeaderActions();
    }
  });
  document.addEventListener("focusin", function(event) {
    if (!event.target.closest("#headerMore, #headerActions")) closeHeaderActions();
  });
  window.matchMedia("(max-width: 1200px)").addEventListener("change", closeHeaderActions);

  var SESSION = window.TRIAGE_SESSION || {
    viewer: { login: "anonymous", role: "viewer" },
    permissions: { can_triage: false, can_sync: false }

  function rebuildDerivedIndexes() {
    META = window.REPORT_DATASET.sync_meta;
    DATA = window.REPORT_DATASET.records || [];
    PR_STATUS = window.REPORT_DATASET.pr_status || {};
    SNAPSHOT_MS = Date.parse(META.snapshot_utc);

    SCOPE_COUNTS.all = DATA.length;
    SCOPE_COUNTS.can = DATA.filter(function(r) { return r.is_canonical; }).length;
    SCOPE_COUNTS.cust = DATA.filter(function(r) { return r.is_customer; }).length;
    SCOPE_COUNTS.bdr = DATA.filter(function(r) { return r.is_borderline_kept; }).length;
    SCOPE_COUNTS.sup = SCOPE_COUNTS.all - SCOPE_COUNTS.can;
    RETRIAGE_LIST = DATA.filter(function(r) { return Boolean(r.needs_retriage); });
    SCOPE_COUNTS.retriage = RETRIAGE_LIST.length;
    SCOPE_COUNTS.excluded = Array.isArray(EXCLUDED_ITEMS)
      ? EXCLUDED_ITEMS.length
      : ((META.excluded_issue_nums || []).length);

    var linkedIssuesMap = {};
    var fallbackRefMap = {};
    for (var i = 0; i < DATA.length; i++) {
      var iss = DATA[i];
      for (var j = 0; j < iss.prs.length; j++) {
        var p = iss.prs[j];
        if (p.state !== "OPEN" && p.state !== "DRAFT") continue;
        var key = p.repo + "#" + p.num;
        if (!linkedIssuesMap[key]) linkedIssuesMap[key] = [];
        linkedIssuesMap[key].push(iss);
        if (!fallbackRefMap[key]) fallbackRefMap[key] = p;
      }
    }

    function isOnlyLinkedToFilteredFixedOrNonOpt(key, st) {
      var linked = linkedIssuesMap[key] || [];
      if (!linked.length) return false;
      var allFiltered = linked.every(function(iss) {
        return iss.cat === "FILTER_NON_OPT_OR_FIXED";
      });
      if (!allFiltered) return false;
      if (st && Array.isArray(st.track_sources)) {
        var hasDirectTrack = st.track_sources.some(function(src) {
          return src && src !== "issue_linked";
        });
        if (hasDirectTrack) return false;
      }
      return true;
    }

    var allKeys = {};
    Object.keys(fallbackRefMap).forEach(function(k) {
      if (!isOnlyLinkedToFilteredFixedOrNonOpt(k, PR_STATUS[k])) allKeys[k] = true;
    });
    Object.keys(PR_STATUS).forEach(function(k) {
      var st = PR_STATUS[k];
      if (st && (st.state === "OPEN" || st.state === "DRAFT") && !isOnlyLinkedToFilteredFixedOrNonOpt(k, st)) {
        allKeys[k] = true;
      }
    });
    PR_BOARD_KEYS = allKeys;

    PR_ITEMS = Object.keys(allKeys).map(function(key) {
      var st = PR_STATUS[key];
      var fb = fallbackRefMap[key];
      var issues = (linkedIssuesMap[key] || []).slice().sort(function(a, b) {
        if (b.sev_rank !== a.sev_rank) return b.sev_rank - a.sev_rank;
        var da = a.diff_rank || 99, db = b.diff_rank || 99;
        if (da !== db) return da - db;
        return b.number - a.number;
      });
      var maxSevRank = 0;
      var bestDiffRank = 99;
      var hasRealBug = false;
      var subSet = {};
      issues.forEach(function(iss) {
        if (iss.sev_rank > maxSevRank) maxSevRank = iss.sev_rank;
        if (iss.diff_rank > 0 && iss.diff_rank < bestDiffRank) bestDiffRank = iss.diff_rank;
        if (iss.cat === "EASY" || iss.cat === "MEDIUM" || iss.cat === "HARD") hasRealBug = true;
        if (iss.subsystem) subSet[iss.subsystem] = true;
      });

      if (!st && fb) {
        st = {
          repo: fb.repo, num: fb.num, label: fb.label, url: fb.url, title: fb.title,
          author: "", state: fb.state, is_draft: fb.state === "DRAFT",
          is_cherry_pick: Boolean(fb.is_cherry_pick),
          updated_at: fb.updated_at || "",
          updated_display: (fb.updated_at || "").slice(0, 16).replace("T", " "),
          waiting_days: 0,
          blocker_stage: fb.state === "DRAFT" ? "DRAFT_OR_HOLD" : "WAITING_REVIEWER",
          ball_owner: fb.state === "DRAFT" ? "HOLD" : "REVIEWER",
          sub_reason: fb.state === "DRAFT" ? "draft" : "zero_review"
        };
      }
      return {
        key: key, st: st, issues: issues,
        maxSevRank: maxSevRank, bestDiffRank: bestDiffRank,
        hasRealBug: hasRealBug, subsystems: Object.keys(subSet)
      };
    });
  }

  function getPrShortChipLabel(st) {

  function getPrBlockerDetail(st) {
    if (!st) return "";
    var sr = st.sub_reason || "";
    var gates = (st.gate_labels || []).map(function(g) { return g.replace("do-not-merge/", ""); }).join(", ");
    if (sr === "draft") return t("report.prBoard.detail.draft");
    if (sr === "hold_label") return t("report.prBoard.detail.hold_label", { gates: gates || "hold" });
    if (sr === "merge_conflict") return t("report.prBoard.detail.merge_conflict");
    if (sr === "needs_ok_to_test") return t("report.prBoard.detail.needs_ok_to_test");
    if (sr === "ci_failed") return t("report.prBoard.detail.ci_failed", { count: (st.failed_checks || []).length || 1 });

    var kpiPrAct = (!mtxDiff && !mtxSev && activeCat === "REAL_ALL" && curPr === "open_fix") ? " active" : "";

      '<button type="button" class="kpi' + kpiRealAct + '" data-kpi-act="real"><div class="lbl"><span>' + esc(t("report.kpi.realBugs.label")) + '</span></div><div class="val" style="color:var(--hard-fg)">' + real + '</div><div class="hint">' + esc(t("report.kpi.realBugs.hint", { pct: (real * 100 / total).toFixed(1), easy: easy, med: med, hard: hard })) + '</div></button>' +
      '<button type="button" class="kpi' + kpiHighAct + '" data-kpi-act="high"><div class="lbl"><span>' + esc(t("report.kpi.highSev.label")) + '</span></div><div class="val" style="color:var(--sev-crit-fg)">' + (critCnt + majCnt) + '</div><div class="hint">' + esc(t("report.kpi.highSev.hint", { crit: critCnt, maj: majCnt })) + '</div></button>' +
      '<button type="button" class="kpi' + kpiPrAct + '" data-kpi-act="pr_open"><div class="lbl"><span>' + esc(t("report.kpi.prCoverage.label")) + '</span></div><div class="val" style="color:var(--pr-open-fg)">' + openPrReal + ' <span class="val-sub">/ ' + real + '</span></div><div class="hint">' + esc(t("report.kpi.prCoverage.hint", { open: openPrReal, unclaimed: unclaimedReal })) + '</div></button>' +
      '<button type="button" class="kpi' + kpiEnhAct + '" data-kpi-act="enh"><div class="lbl"><span>' + esc(t("report.kpi.enhAndNoise.label")) + '</span></div><div class="val" style="color:var(--enh-fg)">' + enh + ' <span class="val-sub">/ ' + flt + '</span></div><div class="hint">' + esc(t("report.kpi.enhAndNoise.hint", { fuzz: fuzz, ai: ai, oth: oth })) + '</div></button>';

      { k: "EASY", c: easy },
      { k: "MEDIUM", c: med },
      { k: "HARD", c: hard },

      { k: "ENHANCEMENT", c: enh },
      { k: "FILTER_RANDOM_FUZZ", c: fuzz },
      { k: "FILTER_AI_OBSCURE", c: ai },
      { k: "FILTER_NON_OPT_OR_FIXED", c: oth }
    ];
    if (retriageScopedCnt > 0 || activeCat === "RETRIAGE") {
      pillDefs.push({ sep: true });
      pillDefs.push({ k: "RETRIAGE", c: retriageScopedCnt, cls: " pill-retriage" });
    }
    pillDefs.push({ sep: true });
    pillDefs.push({ k: "ALL", c: scoped.length });

    var effCat = (mtxDiff || mtxSev) ? (mtxDiff && !mtxSev ? mtxDiff : "__MTX__") : activeCat;
    document.getElementById("catPills").innerHTML = pillDefs.map(function(pd) {
      if (pd.sep) return '<span class="pill-sep" aria-hidden="true"></span>';

      var extraCls = pd.cls || "";
      return '<button type="button" class="pill' + extraCls + actCls + '" data-cat="' + pd.k + '">' +
        '<span>' + esc(t("report.pills." + pd.k)) + '</span>' +
        '<span class="p-cnt">' + pd.c + '</span>' +
      '</button>';
    }).join("");

    var diffs = [
      { k: "EASY", lbl: t("report.matrix.rowEasy"), sub: t("report.matrix.rowEasySub"), dot: "var(--easy-fg)" },
      { k: "MEDIUM", lbl: t("report.matrix.rowMed"), sub: t("report.matrix.rowMedSub"), dot: "var(--med-fg)" },
      { k: "HARD", lbl: t("report.matrix.rowHard"), sub: t("report.matrix.rowHardSub"), dot: "var(--hard-fg)" }
    ];
    var sevs = ["CRITICAL", "MAJOR", "MODERATE", "MINOR"];

    var mtxHtml = "";

        var inPr = cellItems.filter(function(r) { return r.has_open_pr; }).length;
        var wait = cellItems.length - inPr;
        var isAct = (mtxDiff === d.k && mtxSev === s) ? " active" : "";
        var isQw = (d.k === "EASY" && (s === "CRITICAL" || s === "MAJOR"));
        var qwBadge = isQw ? '<span class="qw-pill">' + esc(t("report.matrix.quickWinTag")) + '</span>' : "";
        var cellSub = cellItems.length ? esc(t("report.matrix.cellSub", { wait: wait, inPr: inPr })) : "—";
        cells += '<td class="mcell' + (isQw ? " qw" : "") + isAct + '" data-d="' + d.k + '" data-s="' + s + '">' +
          qwBadge +
          '<span class="mc-num' + (cellItems.length === 0 ? " zero" : "") + '">' + cellItems.length + '</span>' +
          '<span class="mc-sub">' + cellSub + '</span>' +
        '</td>';
      }
      var rAct = (mtxDiff === d.k && !mtxSev) ? " active" : "";
      var rInPr = rowItems.filter(function(r) { return r.has_open_pr; }).length;
      mtxHtml += '<tr>' +
        '<th class="row-hdr"><span class="rh-main"><i class="dot" style="background:' + d.dot + '"></i>' + esc(d.lbl) + '</span><span class="rh-sub">' + esc(d.sub) + '</span></th>' +
        cells +
        '<td class="mcell mcell-total' + rAct + '" data-d="' + d.k + '" data-s="">' +
          '<span class="mc-num">' + rowItems.length + '</span>' +
          '<span class="mc-sub">' + esc(t("report.matrix.unclaimedSub", { wait: rowItems.length - rInPr })) + '</span>' +
        '</td>' +

    var colTotals = "";
    for (var ci = 0; ci < sevs.length; ci++) {
      var cs = sevs[ci];
      var cItems = realList.filter(function(r) { return r.severity === cs; });
      var cInPr = cItems.filter(function(r) { return r.has_open_pr; }).length;
      var cAct = (!mtxDiff && mtxSev === cs) ? " active" : "";
      colTotals += '<td class="mcell mcell-total' + cAct + '" data-d="" data-s="' + cs + '">' +
        '<span class="mc-num">' + cItems.length + '</span>' +
        '<span class="mc-sub">' + esc(t("report.matrix.unclaimedSub", { wait: cItems.length - cInPr })) + '</span>' +
      '</td>';

    mtxHtml += '<tr>' +
      '<th class="row-hdr"><span class="rh-main">' + esc(t("report.matrix.rowTotal")) + '</span></th>' +
      colTotals +
      '<td class="mcell mcell-total" data-d="RESET" data-s="RESET">' +
        '<span class="mc-num">' + real + '</span>' +
        '<span class="mc-sub">' + esc(t("report.matrix.resetSub")) + '</span>' +
      '</td>' +
    '</tr>';

    document.getElementById("mtxBody").innerHTML = mtxHtml;
  }

  function formatPrChip(p) {
    var key = p.repo + "#" + p.num;
    var st = (p.state === "OPEN" || p.state === "DRAFT") ? PR_STATUS[key] : null;

    var cls = "pr-open";
    var stTxt = p.state;
    var extraTip = "";
    var iconSvg = ICONS.pr;

    if (p.state === "MERGED") {
      cls = "pr-merged";
      iconSvg = ICONS.merge;
    } else if (p.state === "CLOSED") {
      cls = "pr-closed";
    } else if (p.state === "UNKNOWN") {
      cls = "pr-unknown";
    } else if (st) {
      cls = STAGE_CHIP_CLS[st.blocker_stage] || "pr-open";
      var prefix = p.is_cherry_pick ? "CP · " : "";
      stTxt = prefix + getPrShortChipLabel(st);
      extraTip = "\n" + getPrBlockerDetail(st);
    } else if (p.state === "DRAFT") {
      cls = "pr-draft";
    } else if (p.is_cherry_pick) {
      stTxt = "CP-OPEN";
    }

    var tip = "[" + p.repo + "] " + p.label + " (" + p.state + "): " + p.title + extraTip;
    var linkHtml = '<a class="pr-chip ' + cls + '" href="' + safeHref(p.url) + '" target="_blank" rel="noopener" title="' + esc(tip) + '">' + iconSvg + '<span>' + esc(p.label) + ' · ' + esc(stTxt) + '</span></a>';

    if ((p.state === "OPEN" || p.state === "DRAFT") && PR_BOARD_KEYS[key]) {
      return '<span class="pr-chip-grp">' + linkHtml +
        '<button type="button" class="pr-jump-btn" data-jump-pr="' + esc(p.label) + '" data-pr-key="' + esc(key) + '" data-is-cp="' + (p.is_cherry_pick ? "1" : "0") + '" title="' + esc(t("report.rw.jumpToPr")) + '">' + ICONS.locate + '</button>' +
      '</span>';
    }
    return linkHtml;
  }

  function getNoteText(r, loc) {
    if (!r.note) return "";
    if (typeof r.note === "string") return r.note;
    return r.note[loc] || r.note.en || r.note["zh-CN"] || "";
  }

  function issueHasMatchingOpenPr(r, predicate) {
    for (var i = 0; i < r.prs.length; i++) {
      var p = r.prs[i];
      if ((p.state === "OPEN" || p.state === "DRAFT") && !p.is_cherry_pick) {
        var st = PR_STATUS[p.repo + "#" + p.num];
        if (st && predicate(st)) return true;
      }
    }
    return false;
  }

    mtxSev = null;

    document.getElementById("q").value = "";

    document.getElementById("subSel").value = "all";
    document.getElementById("sevSel").value = "all";
    document.getElementById("prSel").value = "all";
    document.getElementById("assSel").value = "all";
