  function updateSearchInputAffordances(inputId, kbdId, clearId) {
    var val = document.getElementById(inputId).value;
    document.getElementById(kbdId).hidden = Boolean(val);
    document.getElementById(clearId).hidden = !val;
  }

  function renderIssuesView() {
    var loc = SiteI18n.getLocale();
    var scoped = getScoped();
    renderSummaryAndMatrix(scoped);

    var rawQ = document.getElementById("q").value;
    var q = rawQ.trim().toLowerCase();
    var scVal = document.getElementById("scopeSel").value;
    var sub = document.getElementById("subSel").value;
    var sev = document.getElementById("sevSel").value;
    var prFilter = document.getElementById("prSel").value;
    var assFilter = document.getElementById("assSel").value;
    var updWin = document.getElementById("updWindowSel").value;
    var sinceDate = document.getElementById("sinceDate").value;
    var sortBy = document.getElementById("sortSel").value;

    document.getElementById("sinceDateWrap").hidden = (updWin !== "custom");
    updateSearchInputAffordances("q", "qKbdHint", "qClearBtn");

    // Sortable header visual state
    var thMap = {
      num: sortBy === "num_desc" ? "↓" : (sortBy === "num_asc" ? "↑" : "↕"),
      prio: sortBy === "prio_desc" ? "↓" : "↕",
      updated: sortBy === "updated_desc" ? "↓" : "↕"
    };
    ["num", "prio", "updated"].forEach(function(col) {
      var ind = document.getElementById("si-" + col);
      var th = ind && ind.closest("th");
      if (!ind || !th) return;
      ind.textContent = thMap[col];
      var isSorted = (col === "num" && (sortBy === "num_desc" || sortBy === "num_asc")) ||
                     (col === "prio" && sortBy === "prio_desc") ||
                     (col === "updated" && sortBy === "updated_desc");
      th.classList.toggle("sorted", isSorted);
    });

    // Active filter chips & 1-click Reset
    var chips = [];
    if (mtxDiff || mtxSev) {
      var dText = mtxDiff ? t("report.enums.catShort." + mtxDiff) : t("report.matrix.allDiff");
      var sText = mtxSev ? t("report.enums.severityShort." + mtxSev) : t("report.matrix.allSev");
      chips.push('<span class="active-chip">' + esc(t("report.matrix.activeBadge", { diff: dText, sev: sText })) + ' <button type="button" data-clr="mtx" title="' + esc(t("report.matrix.clearTitle")) + '">' + ICONS.close + '</button></span>');
    } else if (activeCat !== "REAL_ALL") {
      chips.push('<span class="active-chip">' + esc(t("report.pills." + activeCat)) + ' <button type="button" data-clr="cat">' + ICONS.close + '</button></span>');
    }
    if (scVal !== "all") {
      chips.push('<span class="active-chip">' + esc(document.getElementById("scopeSel").selectedOptions[0].textContent) + ' <button type="button" data-clr="scope">' + ICONS.close + '</button></span>');
    }
    if (sub !== "all") {
      chips.push('<span class="active-chip">' + esc(t("report.enums.subsystem." + sub)) + ' <button type="button" data-clr="sub">' + ICONS.close + '</button></span>');
    }
    if (sev !== "all") {
      chips.push('<span class="active-chip">' + esc(document.getElementById("sevSel").selectedOptions[0].textContent) + ' <button type="button" data-clr="sev">' + ICONS.close + '</button></span>');
    }
    if (prFilter !== "all") {
      chips.push('<span class="active-chip">' + esc(document.getElementById("prSel").selectedOptions[0].textContent) + ' <button type="button" data-clr="pr">' + ICONS.close + '</button></span>');
    }
    if (assFilter !== "all") {
      chips.push('<span class="active-chip">' + esc(document.getElementById("assSel").selectedOptions[0].textContent) + ' <button type="button" data-clr="ass">' + ICONS.close + '</button></span>');
    }
    if (updWin !== "all") {
      var wLbl = (updWin === "custom" && sinceDate) ? (t("report.filters.sincePrefix") + " " + sinceDate) : document.getElementById("updWindowSel").selectedOptions[0].textContent;
      chips.push('<span class="active-chip">' + esc(wLbl) + ' <button type="button" data-clr="win">' + ICONS.close + '</button></span>');
    }
    if (q) {
      chips.push('<span class="active-chip">"' + esc(rawQ.trim()) + '" <button type="button" data-clr="q">' + ICONS.close + '</button></span>');
    }
    if (chips.length > 0) {
      chips.push('<button type="button" class="reset-link-btn" id="resetIssuesBtn">' + ICONS.reset + '<span>' + esc(t("report.filters.resetAll")) + '</span></button>');
    }
    document.getElementById("issuesActiveChips").innerHTML = chips.join("");

    var exactNumMatch = /^#(\d+)$/.exec(q);
    var exactNum = exactNumMatch ? parseInt(exactNumMatch[1], 10) : null;

    var rows = scoped.filter(function(r) {
      var isReal = r.cat === "EASY" || r.cat === "MEDIUM" || r.cat === "HARD";
      if (mtxDiff || mtxSev) {
        if (!isReal) return false;
        if (mtxDiff && r.cat !== mtxDiff) return false;
        if (mtxSev && r.severity !== mtxSev) return false;
      } else {
        if (activeCat === "REAL_ALL" && !isReal) return false;
        if (activeCat === "RETRIAGE" && !r.needs_retriage) return false;
        if (activeCat !== "REAL_ALL" && activeCat !== "ALL" && activeCat !== "RETRIAGE" && r.cat !== activeCat) return false;
      }

      if (sub !== "all" && r.subsystem !== sub) return false;

      if (sev === "HIGH_S0_S1" && r.severity !== "CRITICAL" && r.severity !== "MAJOR") return false;
      if ((sev === "CRITICAL" || sev === "MAJOR" || sev === "MODERATE" || sev === "MINOR") && r.severity !== sev) return false;
      if (sev === "GH_UNLABELED" && r.gh_severity !== "unlabeled") return false;

      if (prFilter === "open_fix" && !r.has_open_pr) return false;
      if (prFilter === "ball_reviewer" && !issueHasMatchingOpenPr(r, function(st) { return st.ball_owner === "REVIEWER"; })) return false;
      if (prFilter === "ball_author" && !issueHasMatchingOpenPr(r, function(st) { return st.ball_owner === "AUTHOR"; })) return false;
      if (prFilter === "needs_lgtm2" && !issueHasMatchingOpenPr(r, function(st) { return st.blocker_stage === "NEEDS_LGTM2"; })) return false;
      if (prFilter === "unclaimed" && r.has_open_pr) return false;
      if (prFilter === "has_any" && !r.has_pr) return false;
      if (prFilter === "has_merged" && !r.has_merged_pr) return false;
      if (prFilter === "no_pr" && r.has_pr) return false;

      var hasAss = Boolean(r.assignees && r.assignees.length > 0);
      if (assFilter === "assigned" && !hasAss) return false;
      if (assFilter === "unassigned" && hasAss) return false;

      if (updWin !== "all" && updWin !== "custom") {
        var days = parseInt(updWin, 10);
        var cutoffMs = SNAPSHOT_MS - days * 86400 * 1000;
        if (Date.parse(r.updated_at) < cutoffMs) return false;
      }
      if (updWin === "custom" && sinceDate) {
        if (r.updated_display.slice(0, 10) < sinceDate && r.updated_at.slice(0, 10) < sinceDate) return false;
      }

      if (q) {
        if (exactNum !== null) {
          if (r.number === exactNum) return true;
          return r.prs.some(function(p) { return p.num === exactNum; });
        }
        var prText = r.prs.map(function(p) { return p.label + " " + p.title + " " + p.state; }).join(" ");
        var noteAll = r.note ? ((r.note["zh-CN"] || "") + " " + (r.note.en || "")) : "";
        var subAll = t("report.enums.subsystem." + r.subsystem, null, "zh-CN") + " " + t("report.enums.subsystem." + r.subsystem, null, "en");
        var assTxt = (r.assignees || []).map(function(a) { return "@" + a; }).join(" ");
        var hay = ("#" + r.number + " " + r.title + " @" + r.author + " " + assTxt + " " + noteAll + " " + subAll + " " + r.subsystem + " " + r.severity + " " + r.gh_severity + " " + prText).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    rows.sort(function(a, b) {
      if (sortBy === "updated_desc") {
        if (b.updated_at !== a.updated_at) return b.updated_at.localeCompare(a.updated_at);
        return b.number - a.number;
      }
      if (sortBy === "prio_desc") {
        if (b.sev_rank !== a.sev_rank) return b.sev_rank - a.sev_rank;
        var da = a.diff_rank || 99, db = b.diff_rank || 99;
        if (da !== db) return da - db;
        return b.number - a.number;
      }
      if (sortBy === "num_asc") return a.number - b.number;
      return b.number - a.number;
    });

    document.getElementById("countTxt").textContent = t("report.status.count", { matched: rows.length, scoped: scoped.length });
    syncUrlState();

    var htmlRows = rows.map(function(r) {
      var tags = "";
      if (r.needs_retriage) {
        var rReasons = (r.retriage_reasons || []).map(formatRetriageReason);
        var rTip = (r.retriage_details || []).map(function(d) {
          return formatRetriageReason(d.code) + ": " + d.summary;
        }).join("\n") || rReasons.join(", ");
        var rBadgeTxt = t("report.rw.retriageTag") + (rReasons.length ? (" · " + rReasons[0] + (rReasons.length > 1 ? " +" + (rReasons.length - 1) : "")) : "");
        tags += '<span class="tag-mini tag-retriage" title="' + esc(rTip) + '">' + esc(rBadgeTxt) + '</span>';
      }
      if (r.manual_override) tags += '<span class="tag-mini tag-cal">' + esc(t("report.rw.editedTag")) + '</span>';
      if (r.force_keep) tags += '<span class="tag-mini tag-cal">' + esc(t("report.rw.forceKeepTag")) + '</span>';
      if (r.is_customer) tags += '<span class="tag-mini tag-cust">' + esc(t("report.table.tagCustomer")) + '</span>';
      if (r.is_borderline_kept) tags += '<span class="tag-mini tag-keep">' + esc(t("report.table.tagBorderline")) + '</span>';
      if (!r.is_canonical) tags += '<span class="tag-mini">' + esc(t("report.table.tagSupplemental")) + '</span>';
      var tagWrap = tags ? '<div class="tag-row">' + tags + '</div>' : "";

      var noteStr = getNoteText(r, loc);
      var noteHtml = noteStr ? '<div class="note-callout">' + fmtInlineCode(noteStr) + '</div>' : "";
      var prWrap = r.prs.length ? '<div class="pr-row">' + r.prs.map(formatPrChip).join("") + '</div>' : "";

      var ghRawDisp = r.gh_severity === "unlabeled" ? t("report.table.ghUnlabeled") : r.gh_severity;
      var sevPill = r.severity !== "N/A"
        ? '<span class="sev-badge ' + (SEV_CLS[r.severity] || "sev-na") + '" title="' + esc(t("report.enums.severity." + r.severity)) + '">' + esc(t("report.enums.severityShort." + r.severity)) + '</span>'
        : "";
      var ghDiffers = r.severity !== "N/A" ? (r.gh_severity.toUpperCase() !== r.severity) : (r.gh_severity !== "unlabeled");
      var ghNote = ghDiffers ? '<span class="gh-sev-note">' + esc(t("report.table.ghSevNote", { val: ghRawDisp })) + '</span>' : "";

      var actIcon = CAN_TRIAGE ? ICONS.edit : ICONS.eye;
      var actLabel = CAN_TRIAGE ? t("report.rw.editBtn") : t("report.rw.inspectBtn");
      var actBtnHtml = '<div><button type="button" class="row-act-btn" data-edit-issue="' + r.number + '">' + actIcon + '<span>' + esc(actLabel) + '</span></button></div>';
      var issUrl = "https://github.com/pingcap/tidb/issues/" + r.number;

      var assHtml = (r.assignees && r.assignees.length)
        ? '<div><span class="assignee-pill">' + esc(t("report.table.assignedTo", { user: r.assignees[0] })) + (r.assignees.length > 1 ? " +" + (r.assignees.length - 1) : "") + '</span></div>'
        : "";

      return '<tr data-issue-row="' + r.number + '">' +
        '<td><a class="id-num-link" href="' + issUrl + '" target="_blank" rel="noopener">#' + r.number + '</a>' + actBtnHtml + '</td>' +
        '<td>' +
          '<div class="cls-stack">' +
            '<div class="cls-line">' +
              sevPill +
              '<span class="badge ' + (BADGE_CLS[r.cat] || "badge-other") + '" title="' + esc(t("report.enums.cat." + r.cat) + " · " + t("report.enums.diff." + r.cat)) + '">' + esc(t("report.enums.catShort." + r.cat)) + '</span>' +
            '</div>' +
            ghNote +
          '</div>' +
        '</td>' +
        '<td><button type="button" class="sub-chip" data-filter-sub="' + esc(r.subsystem) + '">' + esc(t("report.enums.subsystem." + r.subsystem)) + '</button></td>' +
        '<td>' +
          '<div><a class="iss-title-link" href="' + issUrl + '" target="_blank" rel="noopener">' + fmtInlineCode(r.title) + '</a></div>' +
          noteHtml + tagWrap + prWrap +
        '</td>' +
        '<td class="meta-cell">' +
          '<span class="upd-val" title="UTC: ' + esc(r.updated_at) + '">' + esc(r.updated_display) + '</span>' +
          '<span>' + esc(t("report.table.createdPrefix", { date: r.created })) + '</span><br>' +
          '<a class="user-link" href="https://github.com/' + encodeURIComponent(r.author) + '" target="_blank" rel="noopener">@' + esc(r.author) + '</a>' +
          assHtml +
        '</td>' +
      '</tr>';
    }).join("");

    if (!htmlRows) {
      document.getElementById("tbody").innerHTML = '<tr><td colspan="5"><div class="empty-state">' +
        '<h3>' + esc(t("report.table.emptyTitle")) + '</h3>' +
        '<p>' + esc(t("report.table.empty")) + '</p>' +
        '<button type="button" class="btn" id="emptyResetIssuesBtn">' + ICONS.reset + '<span>' + esc(t("report.filters.resetAll")) + '</span></button>' +
      '</div></td></tr>';
    } else {
      document.getElementById("tbody").innerHTML = htmlRows;
    }
  }

  function renderPrsView() {
    var mainlineList = PR_ITEMS.filter(function(it) { return !it.st.is_cherry_pick; });
    var realBugMainlineList = mainlineList.filter(function(it) { return it.hasRealBug; });

    document.getElementById("optPrScopeMainline").textContent = t("report.prBoard.filters.scopeMainline", { count: mainlineList.length });
    document.getElementById("optPrScopeReal").textContent = t("report.prBoard.filters.scopeRealBugMainline", { count: realBugMainlineList.length });
    document.getElementById("optPrScopeAll").textContent = t("report.prBoard.filters.scopeAllOpen", { count: PR_ITEMS.length });

    var prScope = document.getElementById("prScopeSel").value;
    var scoped = PR_ITEMS.filter(function(it) {
      if (prScope === "mainline") return !it.st.is_cherry_pick;
      if (prScope === "real_bug_mainline") return !it.st.is_cherry_pick && it.hasRealBug;
      return true;
    });

    var cntReviewer = 0, cntAuthor = 0, cntQueue = 0, cntHold = 0;
    var stageCounts = { ALL: scoped.length };
    STAGE_ORDER.forEach(function(k) { if (k !== "ALL") stageCounts[k] = 0; });

    scoped.forEach(function(it) {
      var b = it.st.ball_owner;
      if (b === "REVIEWER") cntReviewer++;
      else if (b === "AUTHOR") cntAuthor++;
      else if (b === "MERGE_QUEUE") cntQueue++;
      else cntHold++;
      stageCounts[it.st.blocker_stage] = (stageCounts[it.st.blocker_stage] || 0) + 1;
    });

    var tot = scoped.length || 1;
    var ballFilter = document.getElementById("prBallSel").value;
    document.getElementById("prCourtBar").innerHTML =
      '<div class="funnel-seg" data-court="REVIEWER" style="width:' + (cntReviewer * 100 / tot) + '%;background:var(--enh-fg)"></div>' +
      '<div class="funnel-seg" data-court="AUTHOR" style="width:' + (cntAuthor * 100 / tot) + '%;background:var(--sev-crit-fg)"></div>' +
      '<div class="funnel-seg" data-court="MERGE_QUEUE" style="width:' + (cntQueue * 100 / tot) + '%;background:var(--pr-open-fg)"></div>' +
      '<div class="funnel-seg" data-court="HOLD" style="width:' + (cntHold * 100 / tot) + '%;background:var(--flt-fg)"></div>';

    var courts = [
      { k: "REVIEWER", c: cntReviewer, dot: "var(--enh-fg)" },
      { k: "AUTHOR", c: cntAuthor, dot: "var(--sev-crit-fg)" },
      { k: "MERGE_QUEUE", c: cntQueue, dot: "var(--pr-open-fg)" },
      { k: "HOLD", c: cntHold, dot: "var(--flt-fg)" }
    ];
    document.getElementById("prCourtCards").innerHTML = courts.map(function(ct) {
      var isAct = (ballFilter === ct.k) ? " active" : "";
      return '<button type="button" class="court-card' + isAct + '" data-court="' + ct.k + '">' +
        '<div><span class="cc-title"><i class="dot" style="background:' + ct.dot + '"></i>' + esc(t("report.prBoard.courts." + ct.k)) + '</span><span class="cc-sub">' + esc(t("report.prBoard.courts." + ct.k + "_sub")) + '</span></div>' +
        '<span class="cc-val">' + ct.c + '</span>' +
      '</button>';
    }).join("");

    document.getElementById("prStageCards").innerHTML = STAGE_ORDER.map(function(stg) {
      var act = (activePrStage === stg) ? " active" : "";
      var cnt = stageCounts[stg] || 0;
      var pct = stg === "ALL" ? "100%" : ((cnt * 100 / tot).toFixed(0) + "%");
      var accent = STAGE_ACCENTS[stg] || "var(--border-strong)";
      var valColor = "";
      if (stg === "CI_FAILED" || stg === "CONFLICT") valColor = " style=\"color:var(--sev-crit-fg)\"";
      else if (stg === "NEEDS_LGTM2") valColor = " style=\"color:var(--med-fg)\"";
      else if (stg === "READY_MERGING") valColor = " style=\"color:var(--pr-open-fg)\"";
      return '<button type="button" class="stage-card' + act + '" data-stage="' + stg + '" style="--stage-accent:' + accent + '">' +
        '<span class="sc-lbl">' + esc(t("report.prBoard.cards." + stg)) + '</span>' +
        '<span class="sc-row"><span class="sc-val"' + valColor + '>' + cnt + '</span><span class="sc-pct">' + pct + '</span></span>' +
      '</button>';
    }).join("");

    var rawPq = document.getElementById("prQ").value;
    var q = rawPq.trim().toLowerCase();
    var sevFilter = document.getElementById("prSevSel").value;
    var subFilter = document.getElementById("prSubSel").value;
    var sortBy = document.getElementById("prSortSel").value;

    updateSearchInputAffordances("prQ", "prQKbdHint", "prQClearBtn");

    // Sortable PR header state
    var pMap = {
      num: sortBy === "num_desc" ? "↓" : "↕",
      wait: sortBy === "wait_desc" ? "↓" : "↕",
      prio: sortBy === "prio_desc" ? "↓" : "↕",
      upd: sortBy === "upd_desc" ? "↓" : "↕"
    };
    ["num", "wait", "prio", "upd"].forEach(function(col) {
      var ind = document.getElementById("psi-" + col);
      var th = ind && ind.closest("th");
      if (!ind || !th) return;
      ind.textContent = pMap[col];
      th.classList.toggle("sorted", sortBy === col + "_desc");
    });

    // Active filter chips for PR view
    var pChips = [];
    if (prScope !== "mainline") {
      pChips.push('<span class="active-chip">' + esc(document.getElementById("prScopeSel").selectedOptions[0].textContent) + ' <button type="button" data-pclr="scope">' + ICONS.close + '</button></span>');
    }
    if (activePrStage !== "ALL") {
      pChips.push('<span class="active-chip">' + esc(t("report.prBoard.cards." + activePrStage)) + ' <button type="button" data-pclr="stage">' + ICONS.close + '</button></span>');
    }
    if (ballFilter !== "all") {
      pChips.push('<span class="active-chip">' + esc(t("report.prBoard.courts." + ballFilter)) + ' <button type="button" data-pclr="ball">' + ICONS.close + '</button></span>');
    }
    if (sevFilter !== "all") {
      pChips.push('<span class="active-chip">' + esc(document.getElementById("prSevSel").selectedOptions[0].textContent) + ' <button type="button" data-pclr="sev">' + ICONS.close + '</button></span>');
    }
    if (subFilter !== "all") {
      pChips.push('<span class="active-chip">' + esc(t("report.enums.subsystem." + subFilter)) + ' <button type="button" data-pclr="sub">' + ICONS.close + '</button></span>');
    }
    if (q) {
      pChips.push('<span class="active-chip">"' + esc(rawPq.trim()) + '" <button type="button" data-pclr="q">' + ICONS.close + '</button></span>');
    }
    if (pChips.length > 0) {
      pChips.push('<button type="button" class="reset-link-btn" id="resetPrsBtn">' + ICONS.reset + '<span>' + esc(t("report.filters.resetAll")) + '</span></button>');
    }
    document.getElementById("prsActiveChips").innerHTML = pChips.join("");

    var exactPrMatch = /^#(\d+)$/.exec(q);
    var exactPrNum = exactPrMatch ? parseInt(exactPrMatch[1], 10) : null;

    var matched = scoped.filter(function(it) {
      var st = it.st;
      if (activePrStage !== "ALL" && st.blocker_stage !== activePrStage) return false;
      if (ballFilter !== "all" && st.ball_owner !== ballFilter) return false;

      if (sevFilter === "HIGH_S0_S1" && it.maxSevRank < 3) return false;
      if (sevFilter === "CRITICAL" || sevFilter === "MAJOR" || sevFilter === "MODERATE" || sevFilter === "MINOR") {
        var hasSev = it.issues.some(function(iss) { return iss.severity === sevFilter; });
        if (!hasSev) return false;
      }

      if (subFilter !== "all" && it.subsystems.indexOf(subFilter) === -1) return false;

      if (q) {
        if (exactPrNum !== null) {
          if (st.num === exactPrNum) return true;
          return it.issues.some(function(iss) { return iss.number === exactPrNum; });
        }
        var issTxt = it.issues.map(function(iss) { return "#" + iss.number + " " + iss.title; }).join(" ");
        var failTxt = (st.failed_checks || []).map(function(c) { return c.name; }).join(" ");
        var revTxt = [].concat(st.lgtm_by || [], st.reviewed_by || [], st.changes_requested_by || [], st.requested_reviewers || [], st.unresolved_by || []).join(" @");
        var hay = (st.label + " #" + st.num + " " + st.repo + " " + st.title + " @" + st.author + " " + issTxt + " " + failTxt + " @" + revTxt + " " + (st.gate_labels || []).join(" ")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    matched.sort(function(a, b) {
      if (sortBy === "wait_desc") {
        if ((b.st.waiting_days || 0) !== (a.st.waiting_days || 0)) return (b.st.waiting_days || 0) - (a.st.waiting_days || 0);
        return b.st.num - a.st.num;
      }
      if (sortBy === "upd_desc") {
        if ((b.st.updated_at || "") !== (a.st.updated_at || "")) return (b.st.updated_at || "").localeCompare(a.st.updated_at || "");
        return b.st.num - a.st.num;
      }
      if (sortBy === "num_desc") return b.st.num - a.st.num;

      if (b.maxSevRank !== a.maxSevRank) return b.maxSevRank - a.maxSevRank;
      if (a.bestDiffRank !== b.bestDiffRank) return a.bestDiffRank - b.bestDiffRank;
      return (b.st.updated_at || "").localeCompare(a.st.updated_at || "");
    });

    document.getElementById("prCountTxt").textContent = t("report.prBoard.statusCount", { matched: matched.length, scoped: scoped.length });
    syncUrlState();

    var rowsHtml = matched.map(function(it) {
      var st = it.st;
      var chipCls = STAGE_CHIP_CLS[st.blocker_stage] || "pr-open";
      var wDays = st.waiting_days || 0;
      var waitBadge = wDays > 0 ? t("report.prBoard.waitDays", { days: wDays }) : t("report.prBoard.waitToday");
      var waitCls = "tag-mini";
      if (st.ball_owner !== "HOLD") {
        if (wDays >= 21) waitCls += " tag-wait-crit";
        else if (wDays >= 7) waitCls += " tag-wait-warn";
      }

      var cpTag = st.is_cherry_pick ? '<span class="tag-mini">CP</span>' : "";
      var szTag = st.size_label ? '<span class="tag-mini">' + esc(st.size_label.replace("size/", "")) + '</span>' : "";
      var repoTag = (st.repo && st.repo !== "pingcap/tidb") ? '<span class="tag-mini tag-repo">' + esc(st.repo.split("/")[1] || st.repo) + '</span>' : "";

      var issuesHtml = it.issues.map(function(iss) {
        var issUrl = "https://github.com/pingcap/tidb/issues/" + iss.number;
        var sCls = SEV_CLS[iss.severity] || "sev-na";
        var sTxt = iss.severity !== "N/A" ? (' · ' + t("report.enums.severityShort." + iss.severity)) : "";
        return '<div style="margin-bottom:5px;">' +
          '<span class="pr-chip-grp">' +
            '<a class="pr-chip ' + sCls + '" href="' + issUrl + '" target="_blank" rel="noopener" title="' + esc(iss.title) + '">#' + iss.number + esc(sTxt) + '</a>' +
            '<button type="button" class="pr-jump-btn" data-jump-issue="' + iss.number + '" title="' + esc(t("report.rw.jumpToIssue")) + '">' + ICONS.locate + '</button>' +
          '</span>' +
          '<div class="gh-sev-note">' + esc(t("report.enums.catShort." + iss.cat)) + '</div>' +
        '</div>';
      }).join("");
      if (!issuesHtml) issuesHtml = '<span style="color:var(--muted);font-size:12px;">' + esc(t("report.prBoard.noLinkedIssue")) + '</span>';

      var revTags = [];
      if (st.lgtm_by && st.lgtm_by.length) {
        revTags.push('<span class="tag-mini tag-cal">' + esc(t("report.prBoard.revLgtm", { users: fmtUsers(st.lgtm_by) })) + '</span>');
      }
      if (st.changes_requested_by && st.changes_requested_by.length) {
        revTags.push('<span class="tag-mini tag-cust">' + esc(t("report.prBoard.revChanges", { users: fmtUsers(st.changes_requested_by) })) + '</span>');
      }
      if (st.unresolved_threads > 0) {
        var uUsers = fmtUsers(st.unresolved_by);
        var uLabel = uUsers
          ? t("report.prBoard.revThreadsWithUsers", { count: st.unresolved_threads, users: uUsers })
          : t("report.prBoard.revThreadsCountOnly", { count: st.unresolved_threads });
        revTags.push('<span class="tag-mini tag-keep">' + esc(uLabel) + '</span>');
      }
      if (st.requested_reviewers && st.requested_reviewers.length) {
        revTags.push('<span class="tag-mini">' + esc(t("report.prBoard.revRequested", { users: fmtUsers(st.requested_reviewers) })) + '</span>');
      }
      if (st.running_checks_count > 0) {
        revTags.push('<span class="tag-mini">' + esc(t("report.prBoard.ciRunning", { count: st.running_checks_count })) + '</span>');
      }
      (st.gate_labels || []).forEach(function(gl) {
        revTags.push('<span class="tag-mini">' + esc(gl.replace("do-not-merge/", "")) + '</span>');
      });

      var failHtml = "";
      if (st.failed_checks && st.failed_checks.length) {
        var isExp = Boolean(expandedCiKeys[it.key]);
        var limit = isExp ? st.failed_checks.length : 3;
        var shown = st.failed_checks.slice(0, limit).map(function(fc) {
          if (fc.url) {
            return '<a class="ci-fail-chip" href="' + safeHref(fc.url) + '" target="_blank" rel="noopener" title="' + esc(fc.name) + '">' + ICONS.alert + '<span>' + esc(fc.name) + '</span>' + ICONS.ext + '</a>';
          }
          return '<span class="ci-fail-chip" title="' + esc(fc.name) + '">' + ICONS.alert + '<span>' + esc(fc.name) + '</span></span>';
        });
        if (st.failed_checks.length > 3) {
          var btnTxt = isExp
            ? t("report.prBoard.ciCollapse")
            : t("report.prBoard.ciMore", { count: st.failed_checks.length - 3 });
          shown.push('<button type="button" class="ci-more-btn" data-toggle-ci="' + esc(it.key) + '">' + esc(btnTxt) + '</button>');
        }
        failHtml = '<div class="pr-row">' + shown.join("") + '</div>';
      }

      var commitDisp = st.last_commit_at ? st.last_commit_at.slice(0, 10) : "—";
      var authorHtml = st.author
        ? '<a class="user-link" href="https://github.com/' + encodeURIComponent(st.author) + '" target="_blank" rel="noopener">@' + esc(st.author) + '</a>'
        : "";

      return '<tr data-pr-row="' + esc(it.key) + '">' +
        '<td>' +
          '<a class="id-num-link" href="' + safeHref(st.url) + '" target="_blank" rel="noopener">' + esc(st.label) + '</a>' +
          '<div class="tag-row">' + repoTag + szTag + cpTag + '</div>' +
          '<div style="margin-top:3px;">' + authorHtml + '</div>' +
        '</td>' +
        '<td>' +
          '<span class="pr-chip ' + chipCls + '">' + esc(t("report.prBoard.cards." + st.blocker_stage)) + '</span>' +
          '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.4;">' + esc(getPrBlockerDetail(st)) + '</div>' +
          '<div class="tag-row">' +
            '<span class="tag-mini">' + esc(t("report.prBoard.ballTag." + st.ball_owner)) + '</span>' +
            '<span class="' + waitCls + '">' + ICONS.clock + '<span>' + esc(waitBadge) + '</span></span>' +
          '</div>' +
        '</td>' +
        '<td>' + issuesHtml + '</td>' +
        '<td>' +
          '<div><a class="iss-title-link" href="' + safeHref(st.url) + '" target="_blank" rel="noopener">' + fmtInlineCode(st.title) + '</a></div>' +
          (revTags.length ? '<div class="tag-row">' + revTags.join("") + '</div>' : '') +
          failHtml +
        '</td>' +
        '<td class="meta-cell">' +
          '<span class="upd-val">' + esc(st.updated_display || "—") + '</span>' +
          '<span>' + esc(t("report.prBoard.lastCommit", { date: commitDisp })) + '</span>' +
        '</td>' +
      '</tr>';
    }).join("");

    if (!rowsHtml) {
      document.getElementById("prTbody").innerHTML = '<tr><td colspan="5"><div class="empty-state">' +
        '<h3>' + esc(t("report.prBoard.emptyTitle")) + '</h3>' +
        '<p>' + esc(t("report.prBoard.empty")) + '</p>' +
        '<button type="button" class="btn" id="emptyResetPrsBtn">' + ICONS.reset + '<span>' + esc(t("report.filters.resetAll")) + '</span></button>' +
      '</div></td></tr>';
    } else {
      document.getElementById("prTbody").innerHTML = rowsHtml;
    }
  }

  function renderAll() {
    renderSyncAndScopeMeta();
    if (activeView === "prs") renderPrsView();
    else renderIssuesView();
  }

  function setDatasetAndRender(ds, pendingList, hasWorkbench) {
    if (ds) window.REPORT_DATASET = ds;
    if (Array.isArray(pendingList)) PENDING = pendingList;
    if (typeof hasWorkbench === "boolean") {
      DATA_HAS_WORKBENCH = hasWorkbench;
    } else if (ds && CAN_TRIAGE) {
      DATA_HAS_WORKBENCH = true;
    }
    rebuildDerivedIndexes();
    renderAll();
  }

  function applyWorkbenchSnapshot(resp) {
    if (!resp || !Number.isSafeInteger(resp.snapshot_revision) || resp.snapshot_revision <= 0 || resp.snapshot_revision < workbenchRevision) return false;
    workbenchRevision = resp.snapshot_revision;
    capturePendingCardDrafts(document.getElementById("inboxBody"));
    EXCLUDED_ITEMS = Array.isArray(resp.excluded_issues) ? resp.excluded_issues : null;
    setDatasetAndRender(resp.dataset, Array.isArray(resp.pending_candidates) ? resp.pending_candidates : [], true);
    refreshOpenEditDrawer();
    return true;
  }

  function stripWorkbenchFromDataset() {
    DATA_HAS_WORKBENCH = false;
    PENDING = [];
    EXCLUDED_ITEMS = null;
    var ds = window.REPORT_DATASET;
    if (ds) {
      if (ds.sync_meta) {
        delete ds.sync_meta.pending_candidate_nums;
        delete ds.sync_meta.retriage_issue_nums;
        delete ds.sync_meta.excluded_issue_nums;
      }
      (ds.records || []).forEach(function(r) {
        delete r.needs_retriage;
        delete r.retriage_reasons;
        delete r.retriage_details;
        delete r.triaged_at;
        delete r.version;
        delete r.manual_override;
        delete r.force_keep;
        if (Array.isArray(r.prs)) {
          r.prs.forEach(function(p) { delete p.ack_at; });
        }
      });
    }
    rebuildDerivedIndexes();
    var dropEpoch = sessionEpoch;
    fetch(appUrl("./api/dataset.json"), { cache: "no-store" })
      .then(function(res) { return res.ok ? res.json() : null; })
      .then(function(pubDs) {
        if (!pubDs || dropEpoch !== sessionEpoch || CAN_TRIAGE) return;
        setDatasetAndRender(pubDs, [], false);
      })
      .catch(function() {});
  }

  function switchView(nextView) {
    activeView = nextView === "prs" ? "prs" : "issues";
    document.getElementById("viewIssuesSection").hidden = (activeView !== "issues");
    document.getElementById("viewPrsSection").hidden = (activeView !== "prs");
    var issBtn = document.getElementById("tabIssuesBtn");
    var prsBtn = document.getElementById("tabPrsBtn");
    issBtn.classList.toggle("active", activeView === "issues");
    issBtn.setAttribute("aria-selected", activeView === "issues" ? "true" : "false");
    prsBtn.classList.toggle("active", activeView === "prs");
    prsBtn.setAttribute("aria-selected", activeView === "prs" ? "true" : "false");
    renderAll();
  }

  function flashAndScrollRow(selector) {
    requestAnimationFrame(function() {
      var row = document.querySelector(selector);
      if (!row) return;
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.remove("row-flash");
      void row.offsetWidth;
      row.classList.add("row-flash");
    });
  }

  document.getElementById("tabIssuesBtn").addEventListener("click", function() { switchView("issues"); });
  document.getElementById("tabPrsBtn").addEventListener("click", function() { switchView("prs"); });

  document.getElementById("toggleOverviewBtn").addEventListener("click", function() {
    overviewCollapsed = !overviewCollapsed;
    try { if (window.localStorage) window.localStorage.setItem("triage-hub-overview-collapsed", overviewCollapsed ? "1" : "0"); } catch (_) {}
    applyOverviewVisibility();
  });

  document.getElementById("toggleRubricBtn").addEventListener("click", function() {
    var rd = document.getElementById("rubricDrawer");
    rd.hidden = !rd.hidden;
  });

  function positionSyncPopover() {
    var pop = document.getElementById("syncPopover");
    var wrap = document.getElementById("deltaPopWrap");
    if (!pop || !wrap || pop.hidden) return;
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var popW = Math.min(440, vw - 24);
    var wrapRect = wrap.getBoundingClientRect();
    var targetVpLeft = (wrapRect.right - popW >= 12)
      ? (wrapRect.right - popW)
      : Math.max(12, Math.min(wrapRect.left, vw - popW - 12));
    pop.style.width = popW + "px";
    pop.style.right = "auto";
    pop.style.left = Math.round(targetVpLeft - wrapRect.left) + "px";
  }

  document.getElementById("deltaTriggerBtn").addEventListener("click", function(e) {
    e.stopPropagation();
    var pop = document.getElementById("syncPopover");
    pop.hidden = !pop.hidden;
    if (!pop.hidden) positionSyncPopover();
  });
  window.addEventListener("resize", positionSyncPopover);
  document.getElementById("closeSyncPopBtn").addEventListener("click", function() {
    document.getElementById("syncPopover").hidden = true;
  });

  document.getElementById("copySyncBtn").addEventListener("click", function() {
    var query = META.incremental_gh_search_qualifier;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(query);
      }
    } catch (_) {}
    var btn = this;
    btn.classList.add("copied");
    btn.innerHTML = ICONS.check + '<span>' + esc(t("report.sync.copied")) + '</span>';
    if (copyFeedbackTimer) clearTimeout(copyFeedbackTimer);
    copyFeedbackTimer = setTimeout(function() {
      copyFeedbackTimer = null;
      btn.classList.remove("copied");
      btn.innerHTML = ICONS.copy + '<span>' + esc(query) + '</span>';
    }, 1800);
  });

  // Interactive KPI quick-filters
  document.getElementById("kpis").addEventListener("click", function(e) {
    var btn = e.target.closest("[data-kpi-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-kpi-act");
    mtxDiff = null; mtxSev = null;
    if (act === "all") {
      activeCat = "ALL";
      document.getElementById("sevSel").value = "all";
      document.getElementById("prSel").value = "all";
    } else if (act === "real") {
      activeCat = "REAL_ALL";
      document.getElementById("sevSel").value = "all";
      document.getElementById("prSel").value = "all";
    } else if (act === "high") {
      activeCat = "REAL_ALL";
      document.getElementById("sevSel").value = (document.getElementById("sevSel").value === "HIGH_S0_S1") ? "all" : "HIGH_S0_S1";
    } else if (act === "pr_open") {
      activeCat = "REAL_ALL";
      document.getElementById("prSel").value = (document.getElementById("prSel").value === "open_fix") ? "all" : "open_fix";
    } else if (act === "enh") {
      activeCat = (activeCat === "ENHANCEMENT") ? "REAL_ALL" : "ENHANCEMENT";
      document.getElementById("sevSel").value = "all";
    }
    renderIssuesView();
  });

  // Matrix click handler
  document.getElementById("mtxBody").addEventListener("click", function(e) {
    var td = e.target.closest(".mcell");
    if (!td) return;
    var d = td.dataset.d;
    var s = td.dataset.s;
    if (d === "RESET") {
      mtxDiff = null; mtxSev = null;
      activeCat = "REAL_ALL";
    } else {
      var nextD = d || null;
      var nextS = s || null;
      if (mtxDiff === nextD && mtxSev === nextS) {
        mtxDiff = null; mtxSev = null;
      } else {
        mtxDiff = nextD; mtxSev = nextS;
        if (nextD && !nextS) activeCat = nextD;
      }
    }
    renderIssuesView();
  });

  // Debounced search & clear buttons
  function bindSearchInput(inputId, clearId, renderFn) {
    var inp = document.getElementById(inputId);
    var clr = document.getElementById(clearId);
    inp.addEventListener("input", function() {
      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(renderFn, 75);
    });
    clr.addEventListener("click", function() {
      inp.value = "";
      renderFn();
      inp.focus();
    });
  }
  bindSearchInput("q", "qClearBtn", renderIssuesView);
  bindSearchInput("prQ", "prQClearBtn", renderPrsView);

  document.getElementById("scopeSel").addEventListener("change", function() {
    if (this.value === "retriage" && activeCat === "REAL_ALL") {
      activeCat = "ALL";
    }
    renderIssuesView();
  });
  ["subSel", "sevSel", "prSel", "assSel", "updWindowSel", "sinceDate", "sortSel"].forEach(function(id) {
    document.getElementById(id).addEventListener("change", renderIssuesView);
  });
  ["prScopeSel", "prBallSel", "prSevSel", "prSubSel", "prSortSel"].forEach(function(id) {
    document.getElementById(id).addEventListener("change", renderPrsView);
  });

  document.getElementById("prStageCards").addEventListener("click", function(e) {
    var btn = e.target.closest(".stage-card");
    if (!btn) return;
    var stg = btn.dataset.stage;
    activePrStage = (activePrStage === stg && stg !== "ALL") ? "ALL" : stg;
    renderPrsView();
  });

  document.getElementById("catPills").addEventListener("click", function(e) {
    var btn = e.target.closest(".pill");
    if (!btn) return;
    activeCat = btn.dataset.cat;
    mtxDiff = null;
    mtxSev = null;
    renderIssuesView();
  });

  // Delegated clicks across views (legend, courts, sortable headers, subsystem chips, active-chip clear, CI expand, jumps, drawer open)
  document.addEventListener("click", function(e) {
    var syncPop = document.getElementById("syncPopover");
    if (!syncPop.hidden && !e.target.closest("#deltaPopWrap")) {
      syncPop.hidden = true;
    }

    var lgBtn = e.target.closest("[data-lg-cat]");
    if (lgBtn) {
      activeCat = lgBtn.getAttribute("data-lg-cat");
      mtxDiff = null; mtxSev = null;
      renderIssuesView();
      return;
    }

    var courtEl = e.target.closest("[data-court]");
    if (courtEl) {
      var ct = courtEl.getAttribute("data-court");
      var sel = document.getElementById("prBallSel");
      sel.value = (sel.value === ct) ? "all" : ct;
      renderPrsView();
      return;
    }

    var sortTh = e.target.closest("[data-sort-col]");
    if (sortTh) {
      var col = sortTh.getAttribute("data-sort-col");
      var sEl = document.getElementById("sortSel");
      if (col === "num") sEl.value = (sEl.value === "num_desc") ? "num_asc" : "num_desc";
      else if (col === "prio") sEl.value = "prio_desc";
      else if (col === "updated") sEl.value = "updated_desc";
      renderIssuesView();
      return;
    }

    var pSortTh = e.target.closest("[data-pr-sort-col]");
    if (pSortTh) {
      var pCol = pSortTh.getAttribute("data-pr-sort-col");
      document.getElementById("prSortSel").value = pCol + "_desc";
      renderPrsView();
      return;
    }

    var subChip = e.target.closest("[data-filter-sub]");
    if (subChip) {
      var targetSub = subChip.getAttribute("data-filter-sub");
      var subEl = document.getElementById("subSel");
      subEl.value = (subEl.value === targetSub) ? "all" : targetSub;
      renderIssuesView();
      return;
    }

    var clrBtn = e.target.closest("[data-clr]");
    if (clrBtn) {
      var k = clrBtn.getAttribute("data-clr");
      if (k === "mtx") { mtxDiff = null; mtxSev = null; }
      else if (k === "cat") activeCat = "REAL_ALL";
      else if (k === "scope") document.getElementById("scopeSel").value = "all";
      else if (k === "sub") document.getElementById("subSel").value = "all";
      else if (k === "sev") document.getElementById("sevSel").value = "all";
      else if (k === "pr") document.getElementById("prSel").value = "all";
      else if (k === "ass") document.getElementById("assSel").value = "all";
      else if (k === "win") { document.getElementById("updWindowSel").value = "all"; document.getElementById("sinceDate").value = ""; }
      else if (k === "q") document.getElementById("q").value = "";
      renderIssuesView();
      return;
    }

    var pClrBtn = e.target.closest("[data-pclr]");
    if (pClrBtn) {
      var pk = pClrBtn.getAttribute("data-pclr");
      if (pk === "scope") document.getElementById("prScopeSel").value = "mainline";
      else if (pk === "stage") activePrStage = "ALL";
      else if (pk === "ball") document.getElementById("prBallSel").value = "all";
      else if (pk === "sev") document.getElementById("prSevSel").value = "all";
      else if (pk === "sub") document.getElementById("prSubSel").value = "all";
      else if (pk === "q") document.getElementById("prQ").value = "";
      renderPrsView();
      return;
    }

    if (e.target.closest("#resetIssuesBtn") || e.target.closest("#emptyResetIssuesBtn")) {
      resetIssuesFilters();
      return;
    }
    if (e.target.closest("#resetPrsBtn") || e.target.closest("#emptyResetPrsBtn")) {
      resetPrsFilters();
      return;
    }

    var ciToggle = e.target.closest("[data-toggle-ci]");
    if (ciToggle) {
      var ciKey = ciToggle.getAttribute("data-toggle-ci");
      expandedCiKeys[ciKey] = !expandedCiKeys[ciKey];
      renderPrsView();
      return;
    }

    var jumpPrBtn = e.target.closest("[data-jump-pr]");
    if (jumpPrBtn) {
      var prLbl = jumpPrBtn.getAttribute("data-jump-pr");
      var prKey = jumpPrBtn.getAttribute("data-pr-key");
      var isCp = jumpPrBtn.getAttribute("data-is-cp") === "1";
      closeEditDrawer();
      closeInboxDrawer();
      activePrStage = "ALL";
      document.getElementById("prBallSel").value = "all";
      document.getElementById("prSevSel").value = "all";
      document.getElementById("prSubSel").value = "all";
      if (isCp) document.getElementById("prScopeSel").value = "all_open";
      else if (document.getElementById("prScopeSel").value === "real_bug_mainline") document.getElementById("prScopeSel").value = "mainline";
      document.getElementById("prQ").value = prLbl;
      switchView("prs");
      if (prKey) flashAndScrollRow('[data-pr-row="' + CSS.escape(prKey) + '"]');
      return;
    }

    var jumpIssBtn = e.target.closest("[data-jump-issue]");
    if (jumpIssBtn) {
      var issNum = jumpIssBtn.getAttribute("data-jump-issue");
      closeEditDrawer();
      closeInboxDrawer();
      mtxDiff = null; mtxSev = null; activeCat = "ALL";
      document.getElementById("scopeSel").value = "all";
      document.getElementById("subSel").value = "all";
      document.getElementById("sevSel").value = "all";
      document.getElementById("prSel").value = "all";
      document.getElementById("assSel").value = "all";
      document.getElementById("updWindowSel").value = "all";
      document.getElementById("sinceDate").value = "";
      document.getElementById("q").value = "#" + issNum;
      switchView("issues");
      flashAndScrollRow('[data-issue-row="' + issNum + '"]');
      return;
    }

    var editBtn = e.target.closest("[data-edit-issue]");
    if (editBtn) {
      openEditDrawer(parseInt(editBtn.getAttribute("data-edit-issue"), 10));
    }
  });

  // ==================== INSPECT / CALIBRATE DRAWER & RW LOGIC ====================
  function populateSelectOptions(selEl, values, i18nPrefix) {
    selEl.innerHTML = values.map(function(v) {
      return '<option value="' + esc(v) + '">' + esc(t(i18nPrefix + v)) + '</option>';
    }).join("");
  }

  function syncBodyDrawerLock() {
    var anyOpen = !document.getElementById("editDrawer").hidden ||
      !document.getElementById("inboxDrawer").hidden ||
      !document.getElementById("authModal").hidden;
    document.body.classList.toggle("drawer-open", anyOpen);
  }

  function applySessionChrome() {
    var permBadge = document.getElementById("permBadge");
    if (permBadge) {
      permBadge.textContent = CAN_TRIAGE ? t("report.rw.modeBadge") : t("report.rw.readonlyBadge");
      permBadge.classList.toggle("ro", !CAN_TRIAGE);
    }
    var rwBar = document.getElementById("rwBar");
    var pBtn = document.getElementById("pendingInboxBtn");
    var syncPrsBtn = document.getElementById("syncPrsBtn");
    var syncIssuesBtn = document.getElementById("syncIssuesBtn");
    var authUnlockBtn = document.getElementById("authUnlockBtn");
    var authLogoutBtn = document.getElementById("authLogoutBtn");
    var actionCnt = PENDING.length + RETRIAGE_LIST.length;
    if (rwBar) rwBar.hidden = !(CAN_TRIAGE || (AUTH_REQUIRED && IS_AUTHENTICATED));
    if (pBtn) pBtn.hidden = !CAN_TRIAGE;
    if (syncPrsBtn) syncPrsBtn.hidden = !CAN_SYNC;
    if (syncIssuesBtn) syncIssuesBtn.hidden = !CAN_SYNC;
    var githubSignInBtn = document.getElementById("githubSignInBtn");
    var githubIdentity = document.getElementById("githubIdentity");
    if (githubSignInBtn) githubSignInBtn.hidden = !(SESSION.github_login && !IS_AUTHENTICATED);
    if (githubIdentity) {
      githubIdentity.hidden = !(SESSION.github_login && IS_AUTHENTICATED);
      githubIdentity.textContent = SESSION.viewer ? "@" + SESSION.viewer.login : "";
      githubIdentity.title = githubIdentity.textContent;
    }
    if (authUnlockBtn) authUnlockBtn.hidden = !(AUTH_REQUIRED && !IS_AUTHENTICATED && !SESSION.github_login && SESSION.token_login !== false);
    if (authLogoutBtn) authLogoutBtn.hidden = !(AUTH_REQUIRED && IS_AUTHENTICATED);
    if (CAN_TRIAGE && pBtn) {
      document.getElementById("pendingCntBadge").textContent = actionCnt;
      pBtn.classList.toggle("btn-amber", actionCnt > 0);
    }
  }

  function renderDrawerRetriageBanner(rec) {
    var rBanner = document.getElementById("editRetriageBanner");
    if (!rBanner) return;
    if (rec && rec.needs_retriage) {
      var details = (rec.retriage_details && rec.retriage_details.length)
        ? rec.retriage_details
        : (rec.retriage_reasons || []).map(function(c) { return { code: c, summary: "" }; });
      var detLi = details.map(function(d) {
        var lbl = formatRetriageReason(d.code);
        return '<li><b>' + esc(lbl) + '</b>' + (d.summary ? (' — ' + fmtInlineCode(d.summary)) : '') + '</li>';
      }).join("");
      var keepBtn = canSubmitEditDraft()
        ? '<button type="button" class="btn btn-amber" id="drawerAckRetriageBtn">' + ICONS.check + '<span>' + esc(t("report.rw.drawer.keepCurrentBtn")) + '</span></button>'
        : '';
      rBanner.innerHTML =
        '<div class="retriage-banner-hdr">' +
          '<span>' + ICONS.alert + ' ' + esc(t("report.rw.drawer.retriageBannerTitle")) + '</span>' +
          keepBtn +
        '</div>' +
        (detLi ? '<ul class="retriage-list">' + detLi + '</ul>' : '');
      rBanner.hidden = false;
    } else {
      rBanner.innerHTML = "";
      rBanner.hidden = true;
    }
  }

  function populateEditDrawerFormFromRecord(rec) {
    var enums = window.REPORT_DATASET.enums;
    populateSelectOptions(document.getElementById("edCat"), enums.categories, "report.enums.cat.");
    populateSelectOptions(document.getElementById("edSev"), enums.severities, "report.enums.severity.");
    populateSelectOptions(document.getElementById("edSub"), enums.subsystems, "report.enums.subsystem.");

    document.getElementById("edCat").value = rec.cat;
    document.getElementById("edSev").value = rec.severity;
    document.getElementById("edSub").value = rec.subsystem;
    document.getElementById("edBorderline").checked = Boolean(rec.is_borderline_kept);
    document.getElementById("edForceKeep").checked = Boolean(rec.force_keep);
    document.getElementById("edNoteZh").value = (rec.note && rec.note["zh-CN"]) || "";
    document.getElementById("edNoteEn").value = (rec.note && rec.note.en) || "";
  }

  function syncOpenEditDrawerSessionUI(resetExcludeDraft) {
    if (!editingIssueNum || document.getElementById("editDrawer").hidden) return;
    var rec = DATA.find(function(r) { return r.number === editingIssueNum; });
    if (!rec) return;
    var canEdit = canSubmitEditDraft();
    document.getElementById("editDrawerTitle").textContent = canEdit
      ? t("report.rw.drawer.title", { num: editingIssueNum })
      : t("report.rw.drawer.inspectTitle", { num: editingIssueNum });
    renderDrawerRetriageBanner(rec);
    var staleNotice = document.getElementById("editStaleNotice");
    var stale = canEdit && JSON.stringify(editingDraft.version) !== JSON.stringify(copyReviewVersion(rec.version));
    staleNotice.hidden = !stale;

    ["edCat", "edSev", "edSub", "edBorderline", "edForceKeep", "edNoteZh", "edNoteEn"].forEach(function(id) {
      document.getElementById(id).disabled = !canEdit;
    });

    var exZone = document.getElementById("editExcludeZone");
    var canNote = document.getElementById("editCanonicalNote");
    if (canEdit && !rec.is_canonical) {
      exZone.hidden = false;
      if (resetExcludeDraft) {
        exZone.open = false;
        document.getElementById("edExcludeReason").value = "";
      }
      canNote.hidden = true;
    } else if (canEdit && rec.is_canonical) {
      exZone.hidden = true;
      canNote.hidden = false;
    } else {
      exZone.hidden = true;
      canNote.hidden = true;
    }

    document.getElementById("resetOverrideBtn").hidden = !(canEdit && rec.manual_override);
    document.getElementById("saveOverrideBtn").hidden = !canEdit;
    document.getElementById("saveShortcutHint").hidden = !canEdit;
  }

  function applySessionState(nextSession) {
    SESSION = nextSession || {
      viewer: { login: "anonymous", role: "viewer" },
      permissions: { can_triage: false, can_sync: false }
    };
    window.TRIAGE_SESSION = SESSION;
    CAN_TRIAGE = Boolean(SESSION.permissions && SESSION.permissions.can_triage);
    CAN_SYNC = Boolean(SESSION.permissions && SESSION.permissions.can_sync);
    AUTH_REQUIRED = Boolean(SESSION.auth_required);
    IS_AUTHENTICATED = Boolean(SESSION.authenticated);

    applySessionChrome();
    syncOpenEditDrawerSessionUI(false);
    if (!CAN_TRIAGE && !document.getElementById("inboxDrawer").hidden) {
      closeInboxDrawer();
    }
    renderAll();
  }

  function openEditDrawer(num, preserveGen) {
    var rec = DATA.find(function(r) { return r.number === num; });
    if (!rec) return;
    if (!preserveGen) {
      editingIssueNum = num;
      editingDraft = CAN_TRIAGE && DATA_HAS_WORKBENCH ? editDraftFromRecord(rec) : null;
      editDrawerGen += 1;
    }

    var issUrl = "https://github.com/pingcap/tidb/issues/" + rec.number;
    document.getElementById("drawerGhLink").setAttribute("href", issUrl);

    var assDisp = (rec.assignees && rec.assignees.length)
      ? fmtUsers(rec.assignees)
      : t("report.rw.drawer.metaUnassigned");
    var lblChips = (rec.labels || []).map(function(l) {
      return '<span class="tag-mini">' + esc(l) + '</span>';
    }).join("");
    var prsDisp = (rec.prs && rec.prs.length)
      ? '<div class="pr-row">' + rec.prs.map(formatPrChip).join("") + '</div>'
      : "";

    document.getElementById("editIssueMetaCard").innerHTML =
      '<div class="dm-title">#' + rec.number + " · " + fmtInlineCode(rec.title) + '</div>' +
      '<div class="dm-grid">' +
        '<div><b>' + esc(t("report.rw.drawer.metaAuthor")) + ':</b> <a href="https://github.com/' + encodeURIComponent(rec.author) + '" target="_blank" rel="noopener">@' + esc(rec.author) + '</a></div>' +
        '<div><b>' + esc(t("report.rw.drawer.metaAssignees")) + ':</b> ' + esc(assDisp) + '</div>' +
        '<div><b>' + esc(t("report.rw.drawer.metaCreated")) + ':</b> ' + esc(rec.created) + '</div>' +
        '<div><b>' + esc(t("report.rw.drawer.metaUpdated")) + ':</b> ' + esc(rec.updated_display) + '</div>' +
        '<div><b>' + esc(t("report.rw.drawer.metaGhSev")) + ':</b> ' + esc(rec.gh_severity) + '</div>' +
      '</div>' +
      (lblChips ? '<div><div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;">' + esc(t("report.rw.drawer.metaLabels")) + '</div><div class="tag-row" style="margin-top:0;">' + lblChips + '</div></div>' : '') +
      prsDisp;

    populateEditDrawerFormFromRecord(rec);

    document.getElementById("editDrawer").hidden = false;
    syncOpenEditDrawerSessionUI(!preserveGen);
    syncBodyDrawerLock();
  }

  function closeEditDrawer() {
    editingIssueNum = null;
    editingDraft = null;
    editDrawerGen += 1;
    document.getElementById("editDrawer").hidden = true;
    syncBodyDrawerLock();
  }

  function recordNote(rec) {

  function readEditFormValues() {
    var values = {};
    ["edCat", "edSev", "edSub", "edBorderline", "edForceKeep", "edNoteZh", "edNoteEn", "edExcludeReason"].forEach(function(id) {
      var el = document.getElementById(id);

  function restoreEditFormValues(values) {

  function freezeSessionDrafts() {
    capturePendingCardDrafts(document.getElementById("inboxBody"));
    // Inspect cannot replace a writable draft frozen by an earlier auth failure.
    if (editingIssueNum && !document.getElementById("editDrawer").hidden && editingDraft && validReviewVersion(editingDraft.version)) {
      frozenEditDraft = { num: editingIssueNum, binding: editingDraft, values: readEditFormValues() };

    closeEditDrawer();
    closeInboxDrawer();
    document.getElementById("inboxBody").innerHTML = "";
  }

  function restoreSessionDrafts() {
    if (!frozenEditDraft || !CAN_TRIAGE || !DATA_HAS_WORKBENCH) return;
    var draft = frozenEditDraft;
    frozenEditDraft = null;
    if (!draft.binding || !validReviewVersion(draft.binding.version)) return;
    var rec = DATA.find(function(r) { return r.number === draft.num; });
    if (!rec) {
      showToast(t("report.rw.drawer.issueUnavailable", { num: draft.num }), "error");
      return;
    }
    if (!validReviewVersion(rec.version)) return;
    openEditDrawer(draft.num);
    editingDraft = draft.binding;
    restoreEditFormValues(draft.values);
    syncOpenEditDrawerSessionUI(false);
  }

  function copyReviewVersion(version) {
    return version ? { review: version.review, notes: version.notes } : null;
  }

  function pendingReviewBinding(existing, candidate) {
    return existing || { version: copyReviewVersion(candidate.version), watermark: candidate.sync_watermark || "" };
  }

  function reviewLatestPending(draft, candidate) {
    ["cat", "sev", "sub", "bdr", "fk", "noteZh", "noteEn", "exReason"].forEach(function(key) {
      if (!draft.dirty || !draft.dirty[key]) delete draft[key];
    });
    draft.binding = pendingReviewBinding(null, candidate);
  }

  function markPendingFieldDirty(el) {
    if (!el || !el.closest) return;
    var card = el.closest("[data-pend-num]");
    if (!card) return;
    var fields = { "p-cat": "cat", "p-sev": "sev", "p-sub": "sub", "p-bdr": "bdr", "p-fk": "fk", "p-note-zh": "noteZh", "p-note-en": "noteEn", "p-ex-reason": "exReason" };
    var draft = pendingDrafts[card.getAttribute("data-pend-num")];
    if (!draft) return;
    draft.dirty = draft.dirty || {};
    Object.keys(fields).forEach(function(cls) { if (el.classList.contains(cls)) draft.dirty[fields[cls]] = true; });
    capturePendingCardDraft(card);
  }

  // Only an existing, bound draft may receive form values. A committed card
  // can remain in the DOM briefly, but must never recreate a consumed draft.
  function capturePendingCardDraft(card) {
    var key = card.getAttribute("data-pend-num");
    var draft = pendingDrafts[key];
    if (!draft || !draft.binding) return;
    var fields = { cat: ".p-cat", sev: ".p-sev", sub: ".p-sub", bdr: ".p-bdr", fk: ".p-fk", noteZh: ".p-note-zh", noteEn: ".p-note-en", exReason: ".p-ex-reason" };
    Object.keys(fields).forEach(function(key) {
      var el = card.querySelector(fields[key]);
      if (el) draft[key] = key === "bdr" || key === "fk" ? el.checked : el.value;
    });
  }

  function discardPendingDraft(number) {
    delete pendingDrafts[String(number)];
  }

  function editValuesFromRecord(rec) {
    var note = recordNote(rec);
    return { edCat: rec.cat, edSev: rec.severity, edSub: rec.subsystem,
      edBorderline: Boolean(rec.is_borderline_kept), edForceKeep: Boolean(rec.force_keep),
      edNoteZh: note["zh-CN"], edNoteEn: note.en };
  }

  function validReviewVersion(version) {
    return Boolean(version && Number.isSafeInteger(version.review) && version.review > 0 && Number.isSafeInteger(version.notes) && version.notes > 0);
  }

  function cardReviewVersion(card) {
    try {
      var version = JSON.parse(card.getAttribute("data-review-version"));
      return validReviewVersion(version) ? version : null;
    } catch (_) {
      return null;
    }
  }

  function editDraftFromRecord(rec) {
    if (!validReviewVersion(rec.version)) return null;
    return { version: copyReviewVersion(rec.version), originalNote: recordNote(rec), originalValues: editValuesFromRecord(rec) };
  }

  function canSubmitEditDraft() {
    return Boolean(CAN_TRIAGE && DATA_HAS_WORKBENCH && editingIssueNum && editingDraft && validReviewVersion(editingDraft.version) &&
      DATA.some(function(r) { return r.number === editingIssueNum; }));
  }

  function reviewLatestEdit() {
    var rec = DATA.find(function(r) { return r.number === editingIssueNum; });
    if (!rec || !canSubmitEditDraft() || !validReviewVersion(rec.version)) return;
    var latest = editDraftFromRecord(rec);
    Object.keys(latest.originalValues).forEach(function(id) {
      var el = document.getElementById(id);
      var value = el.type === "checkbox" ? el.checked : el.value;
      if (value === editingDraft.originalValues[id]) {
        if (el.type === "checkbox") el.checked = latest.originalValues[id]; else el.value = latest.originalValues[id];
      }
    });
    editDrawerGen += 1;
    editingDraft = latest;
    syncEditSeverityConstraints();
    syncOpenEditDrawerSessionUI(false);
  }

  document.getElementById("editReviewLatestBtn").addEventListener("click", reviewLatestEdit);

  function apiFetch(subpath, opts) {
    var authSettings = typeof SESSION === "object" ? SESSION : {};
    var requestEpoch = sessionEpoch;
    var requestEdit = { number: editingIssueNum, generation: editDrawerGen };
    var reqOpts = opts ? Object.assign({}, opts) : {};
    if (!reqOpts.cache) reqOpts.cache = "no-store";
    var method = String(reqOpts.method || "GET").toUpperCase();
    if (method !== "GET" && method !== "HEAD") {
      reqOpts.headers = Object.assign({ "X-Triage-CSRF": "1" }, reqOpts.headers || {});
    }
    return fetch(appUrl(subpath), reqOpts).then(function(res) {
      return res.text().then(function(raw) {
        var body = null;
        if (raw) {
          try { body = JSON.parse(raw); } catch (_) { body = null; }
        }
        if (!res.ok) {
          var errMsg = (body && typeof body.error === "string") ? body.error : "";
          var isAuthFailure = res.status === 401 ||
            (res.status === 403 && (!IS_AUTHENTICATED || errMsg.indexOf("permission required") !== -1));
          if (isAuthFailure && requestEpoch === sessionEpoch && AUTH_REQUIRED && String(subpath || "").indexOf("api/session/") === -1) {
            sessionEpoch += 1;
            freezeSessionDrafts();
            stripWorkbenchFromDataset();
            applySessionState({
              viewer: { login: "viewer", role: "viewer" },
              permissions: { can_triage: false, can_sync: false },
              auth_required: true,
              github_login: Boolean(authSettings.github_login),
              token_login: authSettings.token_login,
              authenticated: false
            });
            if (!authSettings.github_login) openAuthModal();
          }
          var msg = errMsg || ("HTTP " + res.status + (res.statusText ? " " + res.statusText : ""));
          var err = new Error(msg);
          err.status = res.status;
          if (body && body.committed && requestEpoch === sessionEpoch) {
            return handleCommittedWithoutSnapshot(subpath, requestEpoch, requestEdit);
          }
          if (res.status === 409 && method !== "GET" && requestEpoch === sessionEpoch) {
            return refreshAfterConflict(err, requestEpoch);
          }
          throw err;
        }
        return body || {};
      });
    });
  }

  function handleCommittedWithoutSnapshot(path, epoch, requestEdit) {
    capturePendingCardDrafts(document.getElementById("inboxBody"));
    var pendingMatch = String(path).match(/api\/pending\/(\d+)\/resolve/);
    if (pendingMatch) discardPendingDraft(pendingMatch[1]);
    var issueMatch = String(path).match(/api\/issues\/(\d+)\//);
    if (issueMatch && requestEdit && requestEdit.number === Number(issueMatch[1]) &&
        editingIssueNum === requestEdit.number && editDrawerGen === requestEdit.generation) closeEditDrawer();
    // The commit may invalidate our snapshot. Suspend controls now; only an
    // accepted snapshot restores them. A late failure cannot undo that recovery.
    document.getElementById("inboxBody").innerHTML = "";
    DATA_HAS_WORKBENCH = false;
    PENDING = [];
    EXCLUDED_ITEMS = null;
    closeInboxDrawer();
    syncOpenEditDrawerSessionUI(false);
    renderAll();
    return apiFetch("./api/state").then(function(resp) {
      if (epoch !== sessionEpoch || !CAN_TRIAGE) return;
      applyWorkbenchSnapshot(resp);
      if (!document.getElementById("inboxDrawer").hidden) renderInboxDrawer();
    }).catch(function() {}).then(function() {
      var err = new Error(t("report.rw.inbox.savedRefreshFailed"));
      err.committed = true;
      throw err;
    });
  }

  function refreshAfterConflict(err, epoch) {
    return apiFetch("./api/state").then(function(resp) {
      if (epoch !== sessionEpoch || !CAN_TRIAGE) return;
      applyWorkbenchSnapshot(resp);
      if (!document.getElementById("inboxDrawer").hidden) renderInboxDrawer();
    }).catch(function() {}).then(function() { throw err; });
  }

  // Every workbench snapshot reconciles the editor, while its draft keeps the
  // version originally reviewed. Inspect becomes editable only from this snapshot.
  function refreshOpenEditDrawer() {
    if (!editingIssueNum || document.getElementById("editDrawer").hidden) return;
    var rec = DATA.find(function(r) { return r.number === editingIssueNum; });
    if (!rec) {
      var missingNum = editingIssueNum;
      closeEditDrawer();
      showToast(t("report.rw.drawer.issueUnavailable", { num: missingNum }), "error");
      return;
    }
    var values = editingDraft ? readEditFormValues() : null;
    var excludeOpen = document.getElementById("editExcludeZone").open;
    if (!editingDraft && CAN_TRIAGE && DATA_HAS_WORKBENCH) editingDraft = editDraftFromRecord(rec);
    openEditDrawer(editingIssueNum, true);
    if (values) restoreEditFormValues(values);
    document.getElementById("editExcludeZone").open = excludeOpen;
  }

  function applyEditMutationSnapshot(resp, number, generation) {
    if (editDrawerGen === generation && editingIssueNum === number) closeEditDrawer();
    applyWorkbenchSnapshot(resp);
  }

  function acknowledgedCount(resp) {
    return Array.isArray(resp.acknowledged) ? resp.acknowledged.length : 0;
  }

  function noteForPatch(current, original) {
    return current["zh-CN"] !== original["zh-CN"].trim() || current.en !== original.en.trim() ? current : undefined;
  }

    document.getElementById("inboxBody").addEventListener("click", function(e) {
      var reqEpoch = sessionEpoch;
      if (e.target.closest("#inboxKeepAllBtn")) {
        var keepAllBtn = e.target.closest("#inboxKeepAllBtn");
        var renderedCards = Array.from(document.querySelectorAll("#inboxBody [data-retriage-num]"));
        var nums = renderedCards.map(function(c) { return parseInt(c.getAttribute("data-retriage-num"), 10); });
        if (!nums.length) return;
        var versions = {};
        var allValid = renderedCards.every(function(c) {
          var version = cardReviewVersion(c);
          if (!version) return false;
          versions[c.getAttribute("data-retriage-num")] = version;
          return true;
        });
        if (!allValid) {
          showToast(t("report.rw.inbox.missingReviewVersion"), "error");
          return;
        }
        keepAllBtn.disabled = true;
        apiFetch("./api/retriage/ack-batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numbers: nums, expected_versions: versions })
        }).then(function(resp) {
          if (reqEpoch !== sessionEpoch || !CAN_TRIAGE) return;
          applyWorkbenchSnapshot(resp);
          renderInboxDrawer();
          var ackCnt = acknowledgedCount(resp);
          showToast(t("report.rw.toastRetriageBatchAcked", { count: ackCnt }), "success");
        }).catch(function(err) {
          if (reqEpoch === sessionEpoch) showToast(err.message, "error");
          keepAllBtn.disabled = false;
        });
        return;
      }

      var rCard = e.target.closest("[data-retriage-num]");
      if (rCard) {
        var rNum = parseInt(rCard.getAttribute("data-retriage-num"), 10);
        if (e.target.closest(".r-cal-btn")) {
          closeInboxDrawer();
          openEditDrawer(rNum);
          return;
        }
        if (e.target.closest(".r-keep-btn")) {
          var rKeepBtn = e.target.closest(".r-keep-btn");
          var rVersion = cardReviewVersion(rCard);
          if (!rVersion) {
            showToast(t("report.rw.inbox.missingReviewVersion"), "error");
            return;
          }
          rKeepBtn.disabled = true;
          apiFetch("./api/issues/" + rNum + "/retriage/ack", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ expected_version: rVersion })
          })
            .then(function(resp) {
              if (reqEpoch !== sessionEpoch || !CAN_TRIAGE) return;
              applyWorkbenchSnapshot(resp);
              renderInboxDrawer();
              showToast(t("report.rw.toastRetriageAcked", { num: rNum }), "success");
            }).catch(function(err) {
              if (reqEpoch === sessionEpoch) showToast(err.message, "error");
              rKeepBtn.disabled = false;
            });
          return;
        }
      }

      var xCard = e.target.closest("[data-ex-num]");
      if (xCard && e.target.closest(".x-restore-btn")) {
        var xNum = parseInt(xCard.getAttribute("data-ex-num"), 10);
        var xBtn = e.target.closest(".x-restore-btn");
        var xVersion = cardReviewVersion(xCard);
        if (!xVersion) {
          showToast(t("report.rw.inbox.missingReviewVersion"), "error");
          return;
        }
        xBtn.disabled = true;
        apiFetch("./api/excluded/" + xNum, { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ expected_version: xVersion }) })
          .then(function(resp) {
            if (reqEpoch !== sessionEpoch || !CAN_TRIAGE) return;
            applyWorkbenchSnapshot(resp);
            renderInboxDrawer();
            showToast(t("report.rw.toastExcludedRestored", { num: xNum }), "success");
          }).catch(function(err) {
            if (reqEpoch === sessionEpoch) showToast(err.message, "error");
            xBtn.disabled = false;
          });
        return;
      }

      var card = e.target.closest("[data-pend-num]");
      if (!card) return;
      var num = parseInt(card.getAttribute("data-pend-num"), 10);
      var pcObj = PENDING.find(function(x) { return x.number === num; });
      if (e.target.closest(".p-review-btn")) {
        capturePendingCardDrafts(document.getElementById("inboxBody"));
        if (pcObj) reviewLatestPending(pendingDrafts[String(num)], pcObj);
        renderInboxDrawer();
        return;
      }
      if (!e.target.closest(".p-accept-btn") && !e.target.closest(".p-exclude-btn")) return;
      var draft = pendingDrafts[String(num)];
      if (!draft || !draft.binding || !validReviewVersion(draft.binding.version)) {
        showToast(t("report.rw.inbox.missingReviewVersion"), "error");
        return;
      }
      var binding = draft.binding;
      var pendWatermark = binding.watermark;

      if (e.target.closest(".p-accept-btn")) {
        var btn = e.target.closest(".p-accept-btn");
        btn.disabled = true;
        apiFetch("./api/pending/" + num + "/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "accept",
            cat: card.querySelector(".p-cat").value,
            severity: card.querySelector(".p-sev").value,
            subsystem: card.querySelector(".p-sub").value,
            is_borderline_kept: card.querySelector(".p-bdr").checked,
            force_keep: card.querySelector(".p-fk").checked,
            if_unmodified_since: pendWatermark,
            expected_version: binding.version,
            note: {
              "zh-CN": card.querySelector(".p-note-zh").value.trim(),
              "en": card.querySelector(".p-note-en").value.trim()
            }
          })
        }).then(function(resp) {
          if (reqEpoch !== sessionEpoch || !CAN_TRIAGE) return;
          discardPendingDraft(num);
          applyWorkbenchSnapshot(resp);
          renderInboxDrawer();
          showToast(t("report.rw.toastPendingResolved", { num: num }), "success");
        }).catch(function(err) {
          if (reqEpoch === sessionEpoch) showToast(err.message, "error");
          btn.disabled = false;
        });
      } else if (e.target.closest(".p-exclude-btn")) {
        var exBtn = e.target.closest(".p-exclude-btn");
        exBtn.disabled = true;
        apiFetch("./api/pending/" + num + "/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "exclude",
            exclude_reason: card.querySelector(".p-ex-reason").value.trim(),
            if_unmodified_since: pendWatermark,
            expected_version: binding.version
          })
        }).then(function(resp) {
          if (reqEpoch !== sessionEpoch || !CAN_TRIAGE) return;
          discardPendingDraft(num);
          applyWorkbenchSnapshot(resp);
          renderInboxDrawer();
          showToast(t("report.rw.toastPendingResolved", { num: num }), "success");
        }).catch(function(err) {
          if (reqEpoch === sessionEpoch) showToast(err.message, "error");
          exBtn.disabled = false;
        });
      }
    });
  }

    document.getElementById("authModal").hidden = true;

  function submitAuthLogin() {
    var inp = document.getElementById("authTokenInput");
    var errEl = document.getElementById("authErrorMsg");
    var btn = document.getElementById("authSubmitBtn");
    var tok = (inp.value || "").trim();
    if (!tok || btn.disabled) return;
    btn.disabled = true;
    errEl.hidden = true;
    apiFetch("./api/session/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: tok })
    }).then(function() {
      return apiFetch("./api/state");
    }).then(function(stateResp) {
      if (!stateResp || !stateResp.session || !stateResp.session.permissions || !stateResp.session.permissions.can_triage || !stateResp.dataset) {
        throw new Error("Session cookie was not retained by browser (check HTTPS or --trust-proxy configuration).");
      }
      sessionEpoch += 1;
      excludedLoading = false;
      applySessionState(stateResp.session);
      applyWorkbenchSnapshot(stateResp);
      restoreSessionDrafts();
      btn.disabled = false;
      closeAuthModal();
    }).catch(function(err) {
      errEl.textContent = (err && err.status === 401) ? t("report.rw.authInvalidToken") : ((err && err.message) || t("report.rw.authInvalidToken"));
      errEl.hidden = false;
      btn.disabled = false;
    });
  }

      e.preventDefault();
      submitCurrentOverride();

      if (!document.getElementById("editDrawer").hidden || !document.getElementById("inboxDrawer").hidden || !document.getElementById("authModal").hidden) return;

  }, { passive: true });
  backTopBtn.addEventListener("click", function() {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  SiteI18n.onChange(function() {
    renderAll();
    if (!document.getElementById("inboxDrawer").hidden) renderInboxDrawer();
    refreshOpenEditDrawer();
  });
  SiteI18n.onThemeChange(updateThemeBtnUI);

  rebuildDerivedIndexes();
  SiteI18n.init();
  initStateFromUrl();
  syncHeaderHeightVar();
  switchView(activeView);
})();
</script>
</body>
</html>
